<!--
  ============================================================================
  WORLD MAP ADD-ON: provenance
  ----------------------------------------------------------------------------
  Authored by Claude (Anthropic) for the requesting user on 2026-10-14 as a companion to the
  Civic Benevolence Dashboard. It is independent of commons-addon.html and can be merged in
  either order. It adds one navigation item and one view ("World Map") and removes nothing.
  Merge: paste this block just before the closing body tag. Remove: delete the block.

  WHAT IT DRAWS
  - Only data the dashboard has already loaded; this block makes no network request of its own.
  - Layers: earthquakes of the last 24 h (layerStatus.earthquakes.allPoints, strongest 800),
    NASA EONET open events (naturalEvents.events), GDACS orange/red alerts that carry a point
    location (gdacs.events), and the place chosen under Near You (nearLocation; drawn locally,
    never transmitted).
  - Each layer shows the dashboard's own Live / Cached / Unavailable status, source and age; an
    empty or unavailable layer says so rather than guessing.
  - It redraws when those layers refresh (checked every 1.5 s, only while the view is open).

  LAND OUTLINE (embedded SVG path, generated offline)
  - Natural Earth 1:110m land (public domain) from the world-atlas npm package 2.0.2 (ISC),
    read with topojson-client 3.1.0 (ISC); projected equirectangularly (x = lon + 180, y = 90 - lat)
    and simplified with Douglas-Peucker at 0.4 degrees (1,962 points).
  - SHA-256 of the path string: 713ce9f594769ea15d1d9ca31808d2349b4fedcb4179d287f568314a2728f7f0
  - Coastlines are schematic: for orientation, not for borders or navigation.

  SAFETY AND LIMITS
  - All external text (place names, event titles) is escaped before it reaches the page; markers
    carry text only; nothing is stored; nothing is sent. Not an alerting system.
  - Equirectangular projection exaggerates high latitudes; small quakes are under-reported in
    some regions; markers are not individually keyboard-focusable (the same data is listed in Live
    Earth Monitor and Humanitarian Response, linked from the view); no zoom or pan beyond the
    region presets.
  - Host globals it reads: switchView, VALID_VIEWS, TAB_LABELS, layerStatus, nearLocation,
    badgeHTML (optional). Host DOM: #mainContent, #tab-live, #panel-live. If any required one is
    missing the block logs one line and does nothing.

  EXTENSION HOOK: window.CivicMap.hooks holds functions called after every draw as f(svg, {X, Y, k}),
  and window.CivicMap.redraw() redraws on demand; journey-addon.html draws party pings through them.

  VERIFICATION
  Before delivery: the module parses as JavaScript and was exercised in jsdom against a
  stub of the dashboard's hooks and globals: nav and panel placement, layer plotting
  (invalid and missing coordinates skipped, only red/orange alerts with a point
  location), escaping of external text, marker details, layer toggles, region presets,
  redraw on data refresh, unavailable-layer message, deep link, and the Commons section-
  picker companion. NOT verified: rendering in a real browser, or integration with the
  full dashboard file.
  ============================================================================
-->

    return '<circle data-k="eq" data-d="'+esc(t)+'" cx="'+f2(x)+'" cy="'+f2(y)+'" r="'+f2(Math.min(4,Math.max(.5,(p.mag-1)*.5))*k)+'" fill="'+c+'" fill-opacity=".55" stroke="'+c+'" stroke-width="1" vector-effect="non-scaling-stroke"><title>'+esc(t)+'</title></circle>';}},
 {id:'hz',label:'Open natural-hazard events',key:'naturalEvents',cap:400,
  all:d=>d.events||[],
  text:p=>((p.categories&&p.categories[0])||'Event')+' · '+String(p.title||''),
  mark:(p,x,y,k,t)=>{const s=1.5*k;
    return '<rect data-k="hz" data-d="'+esc(t)+'" x="'+f2(x-s)+'" y="'+f2(y-s)+'" width="'+f2(2*s)+'" height="'+f2(2*s)+'" transform="rotate(45 '+f2(x)+' '+f2(y)+')" fill="#a78bfa" fill-opacity=".85" stroke="#fff" stroke-opacity=".5" stroke-width="1" vector-effect="non-scaling-stroke"><title>'+esc(t)+'</title></rect>';}},
 {id:'al',label:'Disaster alerts (orange/red)',key:'gdacs',cap:400,
  all:d=>(d.events||[]).filter(e=>/orange|red/i.test(e.alertLevel)),
  text:p=>String(p.alertLevel).toUpperCase()+' · '+p.type+' · '+p.name+(p.country?' ('+p.country+')':''),
  mark:(p,x,y,k,t)=>{const s=2*k,c=/red/i.test(p.alertLevel)?'#ef4444':'#f59e0b';
    return '<path data-k="al" data-d="'+esc(t)+'" d="M'+f2(x)+' '+f2(y-s)+'L'+f2(x+s)+' '+f2(y+s)+'L'+f2(x-s)+' '+f2(y+s)+'Z" fill="'+c+'" fill-opacity=".9" stroke="#fff" stroke-opacity=".6" stroke-width="1" vector-effect="non-scaling-stroke"><title>'+esc(t)+'</title></path>';}}
];

/* ---- HOST WIRING: one nav item + one view; nothing existing is replaced ---- */
const PANEL=`
<h2>World Map</h2>
<p class="intro">Everything the dashboard has already loaded, placed on a map: earthquakes from the last 24 hours, open natural-hazard events, orange and red disaster alerts, and the place you chose under Near You. Nothing new is fetched for this view.</p>
<div class="form-row"><label class="muted">Region <select id="mpRegion" class="select-input"></select></label></div>
<div id="mpLayers" class="card-list" style="margin-bottom:12px"></div>
<svg id="mpSvg" viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map"></svg>
<p id="mpInfo" class="status-line" role="status" aria-live="polite" style="margin-top:10px">Click or tap a marker for details.</p>
<p class="fine-print">Key: circles are earthquakes (bigger and redder means stronger), violet diamonds are open hazard events, triangles are orange or red disaster alerts, and the white ring is your chosen place. Each marker is one report from a public source, not a measure of risk. An empty area means nothing was in these feeds, not that nothing is happening. The projection stretches areas near the poles. Land outline: Natural Earth (public domain). This is not an alerting system: follow your local authorities.</p>
<p class="fine-print">Text versions of this data: <button type="button" class="btn btn-secondary" data-go="live">Live Earth Monitor</button> <button type="button" class="btn btn-secondary" data-go="humanitarian">Humanitarian Response</button></p>`;
VALID_VIEWS.push('map'); TAB_LABELS.map='World Map';
const nav=document.createElement('button');
nav.className='nav-item'; nav.id='tab-map'; nav.dataset.view='map';
nav.setAttribute('role','tab'); nav.setAttribute('aria-selected','false'); nav.setAttribute('aria-controls','panel-map');
nav.innerHTML='<span class="nav-dot live"></span>World Map';
($('tab-live')||document.querySelector('.nav-item')).insertAdjacentElement('afterend',nav);
nav.addEventListener('click',()=>switchView('map'));
const sec=document.createElement('section');
sec.className='view'; sec.id='panel-map'; sec.dataset.view='map'; sec.tabIndex=0;
sec.setAttribute('role','tabpanel'); sec.setAttribute('aria-labelledby','tab-map'); sec.innerHTML=PANEL;
($('panel-live')||$('mainContent').lastElementChild).insertAdjacentElement('afterend',sec);

/* ---- DRAWING ---- */
const ON={eq:true,hz:true,al:true};
function draw(){
  const R=REGIONS[$('mpRegion').value]||REGIONS.world, w=R[2]-R[1], h=R[4]-R[3], k=w/360, X=lon=>lon+180, Y=lat=>90-lat;
  let marks='', sum=[];
  LAYERS.forEach(L=>{
    const st=layerStatus[L.key]||{tier:'unavailable',data:null}, items=st.data?L.all(st.data):[], pts=items.filter(ok).slice(0,L.cap);
    const tier=st.tier==='loading'?'loading':(st.data?st.tier:'unavailable');
    $('mpS-'+L.id).innerHTML=(typeof badgeHTML==='function'?badgeHTML(tier):esc(tier))+' '+esc(st.source||'—')+' · updated '+esc(ago(st.lastUpdated))
      +(st.data?' · '+pts.length+' plotted'+(items.length>pts.length?' of '+items.length+(L.id==='eq'?' (strongest first)':' ('+(items.length-pts.length)+' without a point location)'):''):' · no live or cached data right now');
    if(ON[L.id]&&st.data){ sum.push(pts.length+' '+L.label.toLowerCase()); pts.forEach(p=>{marks+=L.mark(p,X(p.lon),Y(p.lat),k,L.text(p));}); }
  });
  const n=getNear();
  if(n){const t='Your chosen place: '+n.name, x=f2(X(n.lon)), y=f2(Y(n.lat));
    marks+='<g data-k="near" data-d="'+esc(t)+'"><circle cx="'+x+'" cy="'+y+'" r="'+f2(2.4*k)+'" fill="none" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="'+x+'" cy="'+y+'" r="'+f2(.7*k)+'" fill="#fff"/><title>'+esc(t)+'</title></g>'; sum.push('your chosen place');}
  let gr=''; for(let lo=-150;lo<=150;lo+=30) gr+='<line x1="'+X(lo)+'" y1="0" x2="'+X(lo)+'" y2="180" vector-effect="non-scaling-stroke"/>';
  for(let la=-60;la<=60;la+=30) gr+='<line x1="0" y1="'+Y(la)+'" x2="360" y2="'+Y(la)+'" vector-effect="non-scaling-stroke"'+(la===0?' stroke="rgba(255,255,255,.18)"':'')+'/>';
  const svg=$('mpSvg');
  svg.setAttribute('viewBox',(R[1]+180)+' '+(90-R[4])+' '+w+' '+h);
  svg.setAttribute('aria-label','World map, '+R[0]+': '+(sum.join(', ')||'no layers shown')+'. Text versions are in Live Earth Monitor and Humanitarian Response.');
  svg.innerHTML='<rect x="0" y="0" width="360" height="180" fill="#0d1b30"/><g stroke="rgba(255,255,255,.08)" stroke-width="1">'+gr+'</g>'
    +'<path data-k="land" d="'+LAND+'" fill="#1d3557" stroke="#3b5b88" stroke-width="1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+marks;
  CM.hooks.forEach(f=>{try{f(svg,{X,Y,k});}catch(e){console.warn('Map hook error',e);}});
}

/* ---- CONTROLS ---- */
$('mpRegion').innerHTML=Object.entries(REGIONS).map(([k,v])=>'<option value="'+k+'">'+esc(v[0])+'</option>').join('');
$('mpLayers').innerHTML=LAYERS.map(L=>'<div class="list-item"><label class="check-row"><input type="checkbox" data-layer="'+L.id+'" checked> <strong>'+esc(L.label)+'</strong></label><div class="list-item-meta" id="mpS-'+L.id+'"></div></div>').join('');
$('mpLayers').addEventListener('change',e=>{const c=e.target.closest('[data-layer]'); if(c){ON[c.dataset.layer]=c.checked; draw();}});
$('mpRegion').addEventListener('change',draw);
$('mpSvg').addEventListener('click',e=>{const m=e.target.closest('[data-d]'); $('mpInfo').textContent=m?m.dataset.d:'Click or tap a marker for details.';});
sec.addEventListener('click',e=>{const b=e.target.closest('button[data-go]'); if(b&&VALID_VIEWS.includes(b.dataset.go)) switchView(b.dataset.go);});

/* ---- REFRESH: redraw when the dashboard's layers (or the chosen place) change; only while the view is open ---- */
const sig=()=>LAYERS.map(L=>{const s=layerStatus[L.key]||{}; return s.tier+':'+s.lastUpdated;}).join('|')+'|'+(getNear()?getNear().lat+','+getNear().lon:'');
let last='';
setInterval(()=>{if(!sec.classList.contains('active')) return; const s=sig(); if(s!==last){last=s; draw();}},1500);
draw(); last=sig();

/* ---- COMPANION: let the Commons add-on's section picker offer this view (works in either merge order) ---- */
const cs=$('cmView'); if(cs&&!Array.from(cs.options).some(o=>o.value==='map')) cs.add(new Option('World Map','map'));
if(location.hash.replace(/^#\/?/,'')==='map') switchView('map',{fromHash:true}); // deep link: the host read the hash before this view existed
}catch(err){console.warn('Map add-on failed to start; the dashboard is unaffected.',err);}
})();</script>
