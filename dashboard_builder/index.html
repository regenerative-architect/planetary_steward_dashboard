<title>Dashboard Builder</title>
<!--
  ============================================================================
  DASHBOARD BUILDER: provenance
  ----------------------------------------------------------------------------
  Authored by Claude (Anthropic) for the requesting user on 2026-10-14. Purpose: automate merging the
  add-ons into the Civic Benevolence Dashboard without a command line.
  How it works: you give it your dashboard file (drag and drop, or choose it). It reads the file locally
  with FileReader, checks for exactly one closing body tag and for the hooks the add-ons need, inserts the
  add-ons you ticked just before the closing body tag, and offers the result as a download named
  index.html. Your original is never modified; re-merging is safe (an add-on already present is skipped).
  Privacy: no network access of any kind; nothing is uploaded or stored; it works offline. No external
  scripts, fonts or images.
  Embedded add-ons (inert string constants, inserted verbatim): 
    Commons (P2P) (commons-addon.html, 460269 bytes, SHA-256 1ab0340a62e2781cbd01a6f24784ac97d85526619f2f02038bb559dc523ecd71)
    World Map (map-addon.html, 35612 bytes, SHA-256 b43555290303ac1a6ddf8834ddd79ac0c0c3b622076b0bed1aa914920a710ab6)
    Stewardship Journey (journey-addon.html, 38267 bytes, SHA-256 9556d4204062f354f2784ee10a9ed5085e280e6c6fe27fc6d4d65888a5780dd3)
    Guided Pathways (pathways-addon.html, 20526 bytes, SHA-256 f40b3f940682a8cad19de525565316bd5f656659b597c97b39a9b94aacadf5ca)
    Offline, Depth and Explain (shell-addon.html, 15211 bytes, SHA-256 e44616dc3f52a8839478425122e28e22c33d46c7da5be4c8141db7737f39c896)
    sw.js (offline file, 2539 bytes, SHA-256 1a8e57bb9ba9276e375da6081324b6938139908e289fb6c644719e18abe09612)
    manifest.webmanifest (offline file, 388 bytes, SHA-256 57e071174ef7a35fae2e8832a90af83e77495a293bb8dfd9df2b7dffcfa5c610)
    icon.svg (offline file, 8234 bytes, SHA-256 5a53b47e0c409c7cc0ade6e606e3fe3083a40ed48baf304082e88f93910da58b)
  Rebuilding: when an add-on changes, regenerate this page so the embedded copies stay identical to the
  standalone add-on files.

  VERIFICATION
  Before delivery, in jsdom: the embedded add-on texts and offline files are byte-
  identical to the standalone files; the merge logic (all add-ons, already merged,
  missing closing body tag, missing hooks); the choose-file, build and download-link
  flow; the offline-file download links; and the merged output loads with all five add-
  ons active and no console errors. NOT verified: drag-and-drop in a real browser, the
  actual file download, or your real dashboard file.

<style>
:root{color-scheme:dark;--bg:#0a1220;--text:#e0e7ff;--muted:#94a3b8;--accent:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:1.5rem;margin:0 0 8px}
p{font-size:.92rem}
.muted{color:var(--muted)}
.drop{display:block;position:relative;border:2px dashed rgba(255,255,255,.28);border-radius:14px;padding:30px 18px;text-align:center;cursor:pointer;background:rgba(255,255,255,.03);margin:18px 0}
.drop.over,.drop:focus-visible,.drop:hover{border-color:var(--accent);background:rgba(59,130,246,.1);outline:none}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
fieldset{border:1px solid rgba(255,255,255,.14);border-radius:12px;margin:0 0 16px;padding:10px 16px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:.9rem}
label.opt input{margin-top:4px;width:18px;height:18px}
button,a.btn{display:inline-block;min-height:44px;padding:10px 18px;border-radius:9px;border:1px solid rgba(59,130,246,.55);background:rgba(59,130,246,.2);color:var(--text);font-size:.92rem;cursor:pointer;text-decoration:none}
button:disabled{opacity:.45;cursor:default}
.note{margin:8px 0;padding:8px 12px;border-radius:8px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);font-size:.85rem}
.note.ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.4)}
code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<main>
<h1>Dashboard Builder</h1>
<p class="muted">Drop your Civic Benevolence Dashboard file here, choose the add-ons, and download one merged, standalone <code>index.html</code>. Everything happens inside this page: your file is not uploaded anywhere and is not modified (you get a new file). It works offline.</p>
<label class="drop" id="drop" for="fileIn" tabindex="0"><span id="dropText"><strong>Drop your index.html here</strong><br><span class="muted">or press to choose the file</span></span><input id="fileIn" type="file" accept=".html,.htm,text/html"></label>
<fieldset id="opts"><legend>Add-ons to include</legend></fieldset>
<p><button id="build" type="button" disabled>Build merged file</button></p>
<div id="result" role="status" aria-live="polite"></div>
<noscript><p class="note">This tool needs JavaScript to read and merge your file locally.</p></noscript>
</main>
<script>
const ADDONS=[{key:"commons",name:"Commons (P2P)",marker:"id=\"cm-module\"",desc:"Private peer-to-peer rooms over Trystero (Nostr by default, plus MQTT and BitTorrent): field notes, section suggestions, snapshot sync, mute.",text:"<\u0021--\n  ============================================================================\n  COMMONS (P2P) ADD-ON: provenance\n  ----------------------------------------------------------------------------\n  Authored by Claude (Anthropic) for the requesting user on 2026-10-13 as a companion\n  to the Civic Benevolence Dashboard. It adds one navigation item and one view\n  (\"Commons (P2P)\") and removes nothing. Merge: paste this whole block just before the\n  closing body tag of the dashboard file. Remove: delete the block.\n\n  REQUESTED ARCHITECTURE AND WHERE IT LIVES\n  - Trystero: bundled below; peer discovery, room management and messaging.\n  - WebRTC: handled by Trystero; direct peer-to-peer data channels, encrypted in transit.\n  - Nostr: default discovery strategy. MQTT and BitTorrent: bundled, selectable alternates.\n  - IPFS: Future Extension. Trystero's IPFS strategy pulls in @waku/sdk (about 0.9 MB\n    minified), which could not be tested here, so the option is shown disabled. To add it:\n    npm i @trystero-p2p/ipfs, add it to the esbuild entry file below, and enable the option\n    in the module (search for \"ipfs\").\n  - makeAction(): three actions in wire(): \"note\", \"view\", \"snap\".\n  - Peer snapshot synchronization: on peer join each side sends its notes (max 100) to the\n    new peer only (\"snap\"); receivers validate every note, merge by id, drop anything older\n    than 7 days, and persist.\n  - IndexedDB: database civic_dashboard_commons_v1, store \"rooms\": notes, room code, alias,\n    strategy. The room password is never stored.\n\n  BUNDLED THIRD-PARTY CODE\n  - Inert block <script type=\"text/plain\" id=\"cm-trystero-src\">. It executes only when the\n    user presses Join with a network strategy; Practice mode never runs it.\n  - trystero 0.26.0 (MIT) through @trystero-p2p/core, nostr, mqtt and torrent 0.26.0.\n  - Built offline from npm with esbuild 0.28.2. entry.js: import * as nostr, torrent and mqtt\n    from the matching @trystero-p2p packages; export {nostr, torrent, mqtt}. Command:\n    esbuild entry.js --bundle --minify --format=iife --global-name=TrysteroBundle\n    --platform=browser --target=es2020 --legal-comments=inline\n  - Embedded unmodified. SHA-256 of the exact text between the script tags:\n    3b4c61996dacc564f8ce83a4df5006b6ec8a2946b3980f4027b96fec95bcef6f\n  - Packages inside the bundle (6, all permissive licenses): @noble/secp256k1@3.2.0, @trystero-p2p/core@0.26.0, @trystero-p2p/mqtt@0.26.0, @trystero-p2p/nostr@0.26.0, @trystero-p2p/torrent@0.26.0, mqtt@5.16.0\n\n  NETWORK (only after Join with a network strategy)\n  - WebSocket connections to the library's default discovery servers (Nostr relays, MQTT\n    brokers or BitTorrent trackers; full lists in the panel, read from the 0.26.0 sources), a\n    public STUN servers (stun.cloudflare.com:3478, stun.l.google.com:19302, stun1.l.google.com:19302, stun2.l.google.com:19302), and direct WebRTC links to peers. Practice mode uses\n    BroadcastChannel only and makes no network connection.\n  - Trade-offs stated in the UI: peers and STUN see your IP; discovery servers see a SHA-1\n    hashed room topic and that you connected; a guessable code can be recovered from the hash,\n    so use Generate plus a password (the password encrypts session descriptions with AES-GCM\n    and gates admission).\n\n  ZERO HARM & ANTI-COERCION (design)\n  - No room directory, user search or public lobby; rooms are private by code. Text-only notes\n    (200 characters; links, emails and long numbers removed; control and bidi characters\n    stripped); no media or files.\n  - Strict validation of every incoming message; per-peer rate limits; 12-peer cap; per-peer\n    mute (muted content is hidden, not forwarded and not stored); suggestions never move\n    anyone; location and cached dashboard data are never attached; 7-day retention; \"Forget\n    room\" and the dashboard's \"Clear all saved data\" both wipe it.\n  - Known limits: notes are unsigned and aliases are self-chosen, so anyone can claim any alias;\n    public discovery servers can be down or filter you; restrictive networks may need a TURN\n    server (not configured).\n\n  OPTIONAL HOST PATCHES (module block G and #cm-patch-style; safe to delete)\n  - Per-section error isolation for renderAllViews, a Clear-all hook, a footer sentence, an\n    attributions entry, and contrast of small grey text (#5b6b85 is about 3.5:1 and #64748b about\n    3.9:1 on the dark background, below the 4.5:1 AA minimum; replaced by #8497b3, about 6:1).\n\n  EXTENSION API (v1): window.CivicCommons.onConnect(fn) hands companion add-ons the live room\n  (makeAction, tell, peers, isMuted, ok for mute/cap/rate-limit checks, onPeerJoin, onPeerLeave);\n  onLeave and onNote subscribe to those events; suggest(view) sends a section suggestion.\n  journey-addon.html and pathways-addon.html use it.\n\n  VERIFICATION\n  Before delivery: the module and bundle parse as JavaScript; the bundle hash above\n  matches the embedded text; the module was exercised in jsdom against a stub of the\n  dashboard's DOM hooks and globals, using the in-page Practice transport with\n  independent storage per simulated browser: join, scrubbed notes, snapshot sync to a\n  late joiner, rate limits, hostile payloads, mute, persistence across sessions, Forget\n  room, Clear-all wipe, deep link; plus a shape check that the real bundle evaluates and\n  joinRoom starts and leaves for Nostr, MQTT and BitTorrent. NOT verified: connections\n  to real Nostr, MQTT or BitTorrent servers, or WebRTC between real devices (the build\n  sandbox's network is closed), and integration with the full dashboard file.\n  ============================================================================\n-->\n<style id=\"cm-style\">#panel-commons .cm-note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem;margin-top:4px}\n#panel-commons pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.72rem}\n#panel-commons ol{margin:0 0 8px 20px}\n#panel-commons ol li{font-size:.84rem;line-height:1.6;margin-bottom:4px;color:#cbd5e1}\n#cmStars{display:block;max-width:100%;margin:8px 0 12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px}\n@media print{#panel-commons .cm-controls,#cmStars,#cmPeers{display:none!important}}<\/style>\n<style id=\"cm-patch-style\">.nav-group-label,.card-footer,.facts-card small,.utc-clock,.footer-note,.fine-print{color:#8497b3}<\/style>\n<script type=\"text/plain\" id=\"cm-trystero-src\" data-package=\"trystero 0.26.0\" data-sha256=\"3b4c61996dacc564f8ce83a4df5006b6ec8a2946b3980f4027b96fec95bcef6f\">var TrysteroBundle=(()=>{var bn=Object.defineProperty;var ad=Object.getOwnPropertyDescriptor;var ld=Object.getOwnPropertyNames;var cd=Object.prototype.hasOwnProperty;var Da=e=>{throw TypeError(e)};var ud=(e,t,r)=>t in e?bn(e,t,{enumerable:!0,configurable:!0,writable:!0,value:r}):e[t]=r;var wn=(e,t)=>{for(var r in t)bn(e,r,{get:t[r],enumerable:!0})},fd=(e,t,r,i)=>{if(t&&typeof t==\"object\"||typeof t==\"function\")for(let s of ld(t))!cd.call(e,s)&&s!==r&&bn(e,s,{get:()=>t[s],enumerable:!(i=ad(t,s))||i.enumerable});return e};var dd=e=>fd(bn({},\"__esModule\",{value:!0}),e);var Se=(e,t,r)=>ud(e,typeof t!=\"symbol\"?t+\"\":t,r),Ro=(e,t,r)=>t.has(e)||Da(\"Cannot \"+r);var K=(e,t,r)=>(Ro(e,t,\"read from private field\"),r?r.call(e):t.get(e)),Fe=(e,t,r)=>t.has(e)?Da(\"Cannot add the same private member more than once\"):t instanceof WeakSet?t.add(e):t.set(e,r),Me=(e,t,r,i)=>(Ro(e,t,\"write to private field\"),i?i.call(e,r):t.set(e,r),r),Oe=(e,t,r)=>(Ro(e,t,\"access private method\"),r);var vn=(e,t,r,i)=>({set _(s){Me(e,t,s,r)},get _(){return K(e,t,i)}});var Zg={};wn(Zg,{mqtt:()=>Ba,nostr:()=>ci,torrent ================================================================= */\n(function(){\n'use strict';\ntry{\nif(typeof switchView!=='function'||typeof VALID_VIEWS==='undefined'||!Array.isArray(VALID_VIEWS)||typeof TAB_LABELS==='undefined'||!document.getElementById('mainContent')){\n  console.info('Commons add-on: host dashboard not detected; skipped.'); return;\n}\nif(document.getElementById('panel-commons')) return;\n\nconst APP_ID='civic-benevolence-dashboard.commons.v1', DB='civic_dashboard_commons_v1';\nconst MAX_PEERS=12, MAX_NOTES=100, KEEP_MS=7*864e5;\nconst HOSTS={\"nostr\": [\"0x-nostr-relay.fly.dev\", \"bendernostur.duckdns.org:8443\", \"cdn.satellite.earth\", \"nos.lol\", \"nostr.chaima.info\", \"nostr.christiansass.de\", \"nostr.rblb.it\", \"nostr.red5d.dev\", \"nostr.robosats.org\", \"nostr.stakey.net\", \"nostrcity-club.fly.dev\", \"relay-dev.gulugulu.moe\", \"relay.aarpia.com\", \"relay.agentry.com\", \"relay.bitmacro.cloud\", \"relay.bullishbounty.com\", \"relay.degmods.com\", \"relay.flashapp.me\", \"relay.grigic.org\", \"relay.hackshed.dev\", \"relay.kaleidoswap.com\", \"relay.layer.systems\", \"relay.nostr.blockhenge.com\", \"relay.nostr.dev.br\", \"relay.nostrmap.net\", \"relay.novospes.com\", \"relay.piazza.today\", \"relay.routstr.com\", \"testr.nymble.world\"], \"mqtt\": [\"broker.emqx.io:8084/mqtt\", \"public.cloud.shiftr.io\", \"broker.hivemq.com:8884/mqtt\", \"test.mosquitto.org:8081/mqtt\"], \"torrent\": [\"open.ftorrent.com\", \"tracker.webtorrent.dev\", \"tracker.openwebtorrent.com\", \"tracker.btorrent.xyz\", \"tracker.files.fm:7073/announce\"], \"stun\": [\"stun.cloudflare.com:3478\", \"stun.l.google.com:19302\", \"stun1.l.google.com:19302\", \"stun2.l.google.com:19302\"]}, ATTR=\"<h4>Bundled code (Commons)<\/h4><ul><li>Trystero 0.26.0 (MIT): serverless WebRTC rooms with Nostr, MQTT and BitTorrent discovery, built into this page; nothing is downloaded at runtime.<\/li><li>Packages inside the bundle: @noble/secp256k1@3.2.0 (MIT), @trystero-p2p/core@0.26.0 (MIT), @trystero-p2p/mqtt@0.26.0 (MIT), @trystero-p2p/nostr@0.26.0 (MIT), @trystero-p2p/torrent@0.26.0 (MIT), mqtt@5.16.0 (MIT).<\/li><\/ul>\", VER='0.26.0';\nconst NAMES={nostr:'Nostr',mqtt:'MQTT',torrent:'BitTorrent',ipfs:'IPFS',local:'Practice (this device)'};\nconst WORDS='alder aspen basalt birch brook cedar cirrus clover coral delta ember fern fjord glacier heron iris juniper kelp lichen maple moss oak otter pebble reed river sage spruce tide willow wren yarrow'.split(' ');\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst ago=t=>{const s=Math.max(0,Math.round((Date.now()-t)/1000));return s<60?s+'s ago':s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago';};\nconst rnd=n=>crypto.getRandomValues(new Uint8Array(n)), hex=n=>Array.from(rnd(n),b=>b.toString(16).padStart(2,'0')).join('');\n\n/* ---- A. HOST WIRING: one nav item + one view; nothing existing is replaced ---- */\nconst PANEL=`\n<h2>Commons <span class=\"muted\">\u00b7 peer-to-peer, opt-in<\/span><\/h2>\n<p class=\"intro\">Study these live figures together without a central server. Join a private room, share short field notes, and suggest a section to others. <strong>Nothing connects until you press Join.<\/strong><\/p>\n<div class=\"facts-card\">\n  <div class=\"card-header\"><h3>What leaves your device<\/h3><\/div>\n  <p class=\"fact-text\">Only your optional alias, a section name, and the note text you type (links, emails and long numbers are removed first). Never your location, cached data or settings. Companion add-ons (such as the Journey) can share a little more, only when you choose, and they say exactly what. Notes go directly browser-to-browser over WebRTC, encrypted in transit.<\/p>\n  <p class=\"fact-text\"><strong>Trade-offs, stated plainly:<\/strong> people in your room can see your IP address, and the public STUN servers that help find a route (listed below) see it too. The discovery servers (relays, brokers or trackers) learn that you connected and a hashed room topic, not your notes. A short or guessable room code can be worked out from that hash, so use Generate and a password. A VPN reduces IP exposure. Notes are unsigned and aliases are self-chosen: treat everything as unverified.<\/p>\n  <details class=\"sources-details\" style=\"margin-top:12px\"><summary>Servers this feature may contact<\/summary><div id=\"cmHosts\" class=\"fine-print\" style=\"margin-top:10px\"><\/div><\/details>\n<\/div>\n<details class=\"sources-details\" open><summary>How to use this<\/summary><div class=\"howto-content\"><ol>\n  <li>Press <em>Generate<\/em> for a room code and password, or type your own. Share both with people you trust, outside this page.<\/li>\n  <li>Pick a discovery method (Nostr is the default) and press <em>Join<\/em>. To try it alone, choose Practice and open this page in a second tab.<\/li>\n  <li>Share a field note, or suggest a section. Nobody is moved automatically.<\/li>\n  <li>Outcome: everyone in the room converges on the same notes; people who join late receive a snapshot from peers. Notes stay 7 days on each device.<\/li>\n<\/ol><\/div><\/details>\n<div class=\"cm-controls\" style=\"margin-top:16px\">\n  <div class=\"form-row\">\n    <input id=\"cmRoom\" class=\"text-input\" type=\"text\" maxlength=\"40\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Room code (letters, numbers, hyphens)\" aria-label=\"Room code\">\n    <input id=\"cmPass\" class=\"text-input\" type=\"text\" maxlength=\"64\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Room password (recommended)\" aria-label=\"Room password\">\n    <button id=\"cmGen\" class=\"btn btn-secondary\" type=\"button\">Generate<\/button>\n  <\/div>\n  <div class=\"form-row\">\n    <select id=\"cmStrategy\" class=\"select-input\" aria-label=\"Discovery method\"><\/select>\n    <input id=\"cmAlias\" class=\"text-input\" type=\"text\" maxlength=\"24\" autocomplete=\"off\" placeholder=\"Alias (optional, self-chosen)\" aria-label=\"Alias\">\n    <button id=\"cmJoin\" class=\"btn\" type=\"button\">Join<\/button>\n    <button id=\"cmLeave\" class=\"btn btn-secondary\" type=\"button\" disabled>Leave<\/button>\n    <button id=\"cmForget\" class=\"btn btn-secondary\" type=\"button\">Forget room<\/button>\n  <\/div>\n<\/div>\n<p id=\"cmStatus\" class=\"status-line\" role=\"status\" aria-live=\"polite\"><\/p>\n<p id=\"cmMsg\" class=\"muted\" role=\"status\" aria-live=\"polite\"><\/p>\n<svg id=\"cmStars\" viewBox=\"0 0 260 140\" width=\"260\" height=\"140\" role=\"img\" aria-label=\"Room constellation\"><\/svg>\n<div id=\"cmPeers\" class=\"place-results\" aria-label=\"Connected peers\"><\/div>\n<div id=\"cmInviteBox\" class=\"status-line\" aria-live=\"polite\"><\/div>\n<h3 class=\"section-sub\">Field notes<\/h3>\n<div class=\"form-row\">\n  <select id=\"cmView\" class=\"select-input\" aria-label=\"Section\"><\/select>\n  <input id=\"cmText\" class=\"text-input\" type=\"text\" maxlength=\"200\" autocomplete=\"off\" placeholder=\"Short note (no personal details)\" aria-label=\"Field note\">\n  <button id=\"cmSend\" class=\"btn\" type=\"button\" disabled>Share note<\/button>\n  <button id=\"cmInvite\" class=\"btn btn-secondary\" type=\"button\" disabled>Suggest section<\/button>\n<\/div>\n<div id=\"cmNotes\" class=\"card-list\"><\/div>\n<details class=\"sources-details\"><summary>Last message sent (exactly as transmitted)<\/summary><pre id=\"cmLast\" class=\"fine-print\">Nothing sent yet.<\/pre><\/details>`;\nVALID_VIEWS.push('commons'); TAB_LABELS.commons='Commons (P2P)';\nconst nav=document.createElement('button');\nnav.className='nav-item'; nav.id='tab-commons'; nav.dataset.view='commons';\nnav.setAttribute('role','tab'); nav.setAttribute('aria-selected','false'); nav.setAttribute('aria-controls','panel-commons');\nnav.innerHTML='<span class=\"nav-dot\"><\/span>Commons (P2P)';\n($('tab-near')||document.querySelector('.tab-buttons .nav-item')||document.querySelector('.nav-item')).insertAdjacentElement('afterend',nav);\nnav.addEventListener('click',()=>switchView('commons'));\nconst sec=document.createElement('section');\nsec.className='view'; sec.id='panel-commons'; sec.dataset.view='commons'; sec.tabIndex=0;\nsec.setAttribute('role','tabpanel'); sec.setAttribute('aria-labelledby','tab-commons'); sec.innerHTML=PANEL;\n($('panel-near')||$('mainContent').lastElementChild).insertAdjacentElement('afterend',sec);\n\n/* ---- B. CORE: everything from a peer is untrusted until it passes through here ---- */\nconst CORE={\n  text(s,max){\n    return String(s==null?'':s).slice(0,max*4).normalize('NFKC')\n      .replace(/[\\u0000-\\u001f\\u007f-\\u009f\\u200b-\\u200f\\u202a-\\u202e\\u2066-\\u2069\\ufeff]/g,' ')\n      .replace(/(?:https?:\\/\\/|www\\.)\\S+/gi,'[link removed]')\n      .replace(/[^\\s@]+@[^\\s@]+\\.[^\\s@]+/g,'[email removed]')\n      .replace(/\\+?\\d[\\d\\s().-]{5,}\\d/g,m=>m.replace(/\\D/g,'').length>=9?'[number removed]':m)\n      .replace(/\\s+/g,' ').trim().slice(0,max);\n  },\n  alias(s){return String(s||'').slice(0,100).normalize('NFKC').replace(/[^\\p{L}\\p{N} _-]/gu,'').replace(/\\s+/g,' ').trim().slice(0,24);},\n  note(n){\n    if(!n||typeof n!=='object') return null;\n    const id=String(n.id||''); if(!/^[a-f0-9]{12,24}$/.test(id)) return null;\n    const t=Number(n.t); if(!Number.isFinite(t)||t<=0) return null;\n    const x=CORE.text(n.x,200); if(!x) return null;\n    return {id,t:Math.min(t,Date.now()+3e5),a:CORE.alias(n.a)||'Anonymous',v:VALID_VIEWS.includes(n.v)?n.v:'commons',x};\n  },\n  merge(list,add){\n    const m=new Map(list.map(n=>[n.id,n])); add.forEach(n=>{if(!m.has(n.id)) m.set(n.id,n);});\n    const cut=Date.now()-KEEP_MS;\n    return Array.from(m.values()).filter(n=>n.t>cut).sort((a,b)=>b.t-a.t).slice(0,MAX_NOTES);\n  }\n};\nconst hits={};\nconst allow=(k,max,ms)=>{const now=Date.now(),a=(hits[k]=(hits[k]||[]).filter(t=>now-t<ms)); if(a.length>=max) return false; a.push(now); return true;};\n\n/* ---- C. STORAGE: separate IndexedDB, local only, wiped by \"Clear all saved data\" ---- */\nlet dbp=null;\nconst idb=()=>dbp||(dbp=new Promise((res,rej)=>{\n  if(!window.indexedDB) return rej(new Error('no indexedDB'));\n  const r=indexedDB.open(DB,1); r.onupgradeneeded=()=>r.result.createObjectStore('rooms',{keyPath:'room'});\n  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);\n}));\nconst store=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{\n  const tx=db.transaction('rooms',mode), rq=fn(tx.objectStore('rooms'));\n  tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);\n})).catch(()=>null);\nconst loadRoom=c=>store('readonly',s=>s.get(c)), saveRoom=r=>store('readwrite',s=>s.put(r)), dropRoom=c=>store('readwrite',s=>s.delete(c)), wipe=()=>store('readwrite',s=>s.clear());\n\n/* ---- D. TRANSPORTS: both expose the Trystero room surface this module uses:\n        room.onPeerJoin / onPeerLeave (assignable), room.makeAction(name) -> {send, onMessage}, room.leave() ---- */\nfunction localTransport(code){ // same-device tabs via BroadcastChannel: no network at all\n  const id=hex(10), bc=new BroadcastChannel('civic-commons:'+code), seen=new Set(), acts={};\n  const post=m=>bc.postMessage(Object.assign({from:id},m));\n  const R={selfId:id,onPeerJoin:null,onPeerLeave:null,\n    makeAction(name){const a={onMessage:null,send(d,o){post({k:'msg',a:name,d,to:o&&o.target});return Promise.resolve();}};acts[name]=a;return a;},\n    leave(){post({k:'bye'});bc.close();}};\n  bc.onmessage=e=>{const m=e.data; if(!m||m.from===id||(m.to&&m.to!==id)) return;\n    if(m.k==='hi'){if(!seen.has(m.from)){seen.add(m.from); R.onPeerJoin&&R.onPeerJoin(m.from); post({k:'hi',to:m.from});}}\n    else if(m.k==='bye'){if(seen.delete(m.from)&&R.onPeerLeave) R.onPeerLeave(m.from);}\n    else if(m.k==='msg'&&acts[m.a]&&acts[m.a].onMessage) acts[m.a].onMessage(m.d,{peerId:m.from});};\n  post({k:'hi'}); return R;\n}\nfunction loadBundle(){ // the bundled Trystero sits inert in <script type=\"text/plain\">; it only runs now, on Join\n  if(window.TrysteroBundle) return true;\n  const src=$('cm-trystero-src'); if(!src) return false;\n  const s=document.createElement('script'); s.textContent=src.textContent; document.head.appendChild(s); s.remove();\n  return !!window.TrysteroBundle;\n}\nfunction networkTransport(key,code,pw){\n  if(!loadBundle()||!window.TrysteroBundle[key]) throw new Error('\"'+key+'\" is not available in this build');\n  const cfg={appId:APP_ID}; if(pw) cfg.password=pw;\n  S.self=window.TrysteroBundle[key].selfId;\n  return window.TrysteroBundle[key].joinRoom(cfg,code,{onJoinError:()=>say('A peer could not be admitted'+(pw?': check that the password matches.':'.')+' Restrictive networks can also block direct connections.')});\n}\n\n/* ---- E. ROOM LOGIC ---- */\nconst S={room:null,key:'nostr',code:'',alias:'',self:'',notes:[],peers:new Set(),muted:new Set(),act:{},invite:null,lastSend:0,lastInvite:0,poll:0,timer:0,joining:false};\nconst say=m=>{$('cmMsg').textContent=m||'';};\nconst tell=(act,data,target)=>{try{Promise.resolve(act.send(data,target?{target}:undefined)).catch(()=>{});}catch(e){}};\nconst pub=()=>S.notes.filter(n=>!S.muted.has(n.src)).slice(0,MAX_NOTES).map(n=>({id:n.id,t:n.t,a:n.a,v:n.v,x:n.x}));\nconst persist=()=>{if(S.code) saveRoom({room:S.code,strategy:S.key,alias:S.alias,notes:pub(),saved:Date.now()});};\nconst cleanCode=v=>String(v||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);\nconst adopt=id=>{if(S.peers.has(id)) return true; if(S.peers.size>=MAX_PEERS) return false; S.peers.add(id); return true;};\n/* ---- EXTENSION API for companion add-ons (window.CivicCommons, v1): they receive the live room on connect ---- */\nconst EXT={conn:[],leave:[],join:[],part:[],note:[]};\nconst fire=(a,...x)=>a.forEach(f=>{try{f(...x);}catch(e){console.warn('Commons extension error',e);}});\nconst ctx=()=>({self:S.self,code:S.code,key:S.key,makeAction:n=>S.room.makeAction(n),tell,peers:()=>Array.from(S.peers),isMuted:id=>S.muted.has(id),\n  ok:(id,k,max,ms)=>!S.muted.has(id)&&adopt(id)&&allow('x'+k+id,max,ms),onPeerJoin:f=>EXT.join.push(f),onPeerLeave:f=>EXT.part.push(f)});\nwindow.CivicCommons={v:1,suggest:v=>suggest(v),onConnect:f=>{EXT.conn.push(f); if(S.room) fire([f],ctx());},onLeave:f=>EXT.leave.push(f),onNote:f=>EXT.note.push(f),\n  state:()=>({on:!!S.room,code:S.code,key:S.key,self:S.self,peers:Array.from(S.peers)})};\n\nfunction wire(){ // one makeAction per message type; every handler validates, rate-limits, then merges\n  const R=S.room, note=R.makeAction('note'), view=R.makeAction('view'), snap=R.makeAction('snap');\n  S.act={note,view};\n  EXT.join.length=0; EXT.part.length=0;\n  const ok=(id,k,max,ms)=>!S.muted.has(id)&&adopt(id)&&allow(k+id,max,ms);\n  R.onPeerJoin=id=>{ // peer snapshot sync: the newcomer gets our notes; we get theirs when their join fires\n    if(adopt(id)&&!S.muted.has(id)) tell(snap,{notes:pub()},id);\n    clearTimeout(S.timer); say(''); fire(EXT.join,id); paint();\n  };\n  R.onPeerLeave=id=>{S.peers.delete(id); fire(EXT.part,id); paint();};\n  note.onMessage=(d,c)=>{if(!ok(c.peerId,'n',5,10000)) return; const n=CORE.note(d); if(n){n.src=c.peerId; S.notes=CORE.merge(S.notes,[n]); persist(); paint();}};\n  snap.onMessage=(d,c)=>{if(!ok(c.peerId,'s',1,30000)) return;\n    const list=d&&Array.isArray(d.notes)?d.notes.slice(0,MAX_NOTES):[];\n    S.notes=CORE.merge(S.notes,list.map(CORE.note).filter(Boolean).map(n=>Object.assign(n,{src:c.peerId}))); persist(); paint();};\n  view.onMessage=(d,c)=>{if(!ok(c.peerId,'v',3,30000)) return; if(d&&VALID_VIEWS.includes(d.v)){S.invite={v:d.v,id:c.peerId}; paint();}};\n  fire(EXT.conn,ctx());\n}\nfunction connect(){\n  if(S.room||S.joining) return;\n  const key=$('cmStrategy').value, code=cleanCode($('cmRoom').value), pw=$('cmPass').value.slice(0,64);\n  if(code.length<3){say('Room code needs at least 3 characters (letters, numbers, hyphens). Press Generate for a strong one.');return;}\n  if(key!=='local'&&window.isSecureContext===false){say('Network rooms need a secure page (HTTPS or localhost). Practice mode still works here.');return;}\n  S.joining=true; S.key=key; S.code=code; S.alias=CORE.alias($('cmAlias').value); paint();\n  loadRoom(code).then(rec=>{\n    S.notes=CORE.merge([],((rec&&rec.notes)||[]).map(CORE.note).filter(Boolean));\n    try{ S.room=key==='local'?localTransport(code):networkTransport(key,code,pw); if(key==='local') S.self=S.room.selfId; }\n    catch(e){S.room=null; say('Could not start: '+(e&&e.message||e)+'. Network strategies need HTTPS or localhost.'); S.joining=false; paint(); return;}\n    S.joining=false; wire();\n    S.poll=setInterval(status,2000);\n    if(key!=='local') S.timer=setTimeout(()=>{if(S.room&&!S.peers.size) say('No peers yet. Share the code and password, or try another discovery method. If you expected peers, your network or an embedded preview may be blocking relays or WebRTC.');},20000);\n    paint();\n  });\n}\nfunction leave(skipSave){\n  if(!S.room) return;\n  clearInterval(S.poll); clearTimeout(S.timer);\n  try{S.room.leave();}catch(e){}\n  S.room=null; S.peers.clear(); S.invite=null; S.act={}; if(!skipSave) persist(); fire(EXT.leave);\n  say('Left the room. Notes you received stay on this device until you forget the room or clear saved data.'); paint();\n}\nfunction sendNote(){\n  if(!S.room) return;\n  const now=Date.now(); if(now-S.lastSend<3000){say('Please wait a few seconds between notes.');return;}\n  const x=CORE.text($('cmText').value,200); if(!x){say('Write a short note first.');return;}\n  const n=CORE.note({id:hex(8),t:now,a:S.alias,v:$('cmView').value,x}); if(!n) return;\n  const out={id:n.id,t:n.t,a:n.a,v:n.v,x:n.x}; S.lastSend=now;\n  S.notes=CORE.merge(S.notes,[Object.assign({},n,{src:'me'})]);\n  tell(S.act.note,out); $('cmLast').textContent=JSON.stringify({action:'note',data:out},null,1);\n  $('cmText').value=''; say(''); persist(); fire(EXT.note); paint();\n}\nfunction suggest(want){\n  if(!S.room) return;\n  const now=Date.now(); if(now-S.lastInvite<10000){say('Please wait a few seconds between suggestions.');return;}\n  const pick=typeof want==='string'?want:$('cmView').value, v=VALID_VIEWS.includes(pick)?pick:'overview'; S.lastInvite=now;\n  tell(S.act.view,{v}); $('cmLast').textContent=JSON.stringify({action:'view',data:{v}},null,1);\n  say('Suggestion sent. Nobody is moved automatically.');\n}\nfunction forget(){\n  const code=cleanCode($('cmRoom').value)||S.code; if(!code){say('Enter the room code to forget.');return;}\n  if(S.room&&S.code===code) leave(true);\n  dropRoom(code).then(()=>{ if(S.code===code) S.notes=[]; say('Saved notes for \"'+code+'\" were removed from this device.'); paint(); });\n}\n\n/* ---- F. UI ---- */\nfunction status(){\n  const on=!!S.room; let relays='';\n  if(on&&S.key!=='local'){try{const s=Object.values(window.TrysteroBundle[S.key].getRelaySockets()); relays=' \u00b7 '+s.filter(x=>x&&x.readyState===1).length+'/'+s.length+' relay connections open';}catch(e){}}\n  $('cmStatus').textContent=on?('Connected via '+NAMES[S.key]+' \u00b7 room \"'+S.code+'\" \u00b7 '+S.peers.size+' peer'+(S.peers.size===1?'':'s')+' \u00b7 you are '+String(S.self).slice(0,4)+relays):'Not connected. Nothing is contacted until you press Join.';\n  nav.firstElementChild.classList.toggle('live',on);\n}\nfunction stars(){ // constellation: you at the centre, each connected peer a star on a ring\n  const ids=Array.from(S.peers), n=ids.length; let lines='',dots='<circle cx=\"130\" cy=\"70\" r=\"6\" fill=\"#e0e7ff\"/>';\n  ids.forEach((id,i)=>{const a=2*Math.PI*i/Math.max(n,1)-Math.PI/2, x=(130+95*Math.cos(a)).toFixed(1), y=(70+50*Math.sin(a)).toFixed(1), m=S.muted.has(id);\n    lines+='<line x1=\"130\" y1=\"70\" x2=\"'+x+'\" y2=\"'+y+'\" stroke=\"#3b82f6\" stroke-opacity=\"'+(m?.15:.5)+'\"/>';\n    dots+='<circle cx=\"'+x+'\" cy=\"'+y+'\" r=\"4\" fill=\"'+(m?'#64748b':'#60a5fa')+'\"/>';});\n  $('cmStars').innerHTML=lines+dots;\n  $('cmStars').setAttribute('aria-label','Room constellation: you and '+n+' connected peer'+(n===1?'':'s'));\n}\nfunction paint(){\n  const on=!!S.room;\n  $('cmJoin').disabled=on||S.joining; $('cmLeave').disabled=!on; $('cmSend').disabled=!on; $('cmInvite').disabled=!on;\n  ['cmRoom','cmPass','cmStrategy','cmAlias','cmGen'].forEach(id=>{$(id).disabled=on||S.joining;});\n  status();\n  const peers=Array.from(S.peers);\n  $('cmPeers').innerHTML=peers.length?peers.map(id=>'<button type=\"button\" class=\"btn btn-secondary\" data-mute=\"'+esc(id)+'\">'+(S.muted.has(id)?'Unmute':'Mute')+' peer '+esc(String(id).slice(0,4))+'<\/button>').join(''):(on?'<span class=\"muted\">Waiting for peers\u2026<\/span>':'');\n  const vis=S.notes.filter(n=>!S.muted.has(n.src));\n  $('cmNotes').innerHTML=vis.length?vis.map(n=>'<div class=\"list-item\"><div class=\"list-item-title\">'+esc(n.a)+' <span class=\"muted\">\u00b7 '+esc(TAB_LABELS[n.v]||n.v)+'<\/span><\/div><div class=\"list-item-meta\">'+esc(ago(n.t))+' \u00b7 unverified<\/div><div class=\"cm-note\">'+esc(n.x)+'<\/div><\/div>').join(''):'<p class=\"muted\">No notes yet.<\/p>';\n  const iv=S.invite;\n  $('cmInviteBox').innerHTML=iv&&!S.muted.has(iv.id)?'<span>Peer '+esc(String(iv.id).slice(0,4))+' suggests <strong>'+esc(TAB_LABELS[iv.v]||iv.v)+'<\/strong><\/span> <button type=\"button\" class=\"btn\" data-go=\"'+esc(iv.v)+'\">Go there<\/button> <button type=\"button\" class=\"btn btn-secondary\" data-dismiss=\"1\">Dismiss<\/button>':'';\n  stars();\n}\nconst haveBundle=!!$('cm-trystero-src');\n$('cmStrategy').innerHTML=[['nostr','Nostr relays (default)'],['mqtt','MQTT brokers'],['torrent','BitTorrent trackers'],['ipfs','IPFS (Future Extension, not bundled)'],['local','Practice: other tabs on this device (no network)']]\n  .map(([k,l])=>'<option value=\"'+k+'\"'+((k==='ipfs'||(k!=='local'&&!haveBundle))?' disabled':'')+'>'+esc(l)+'<\/option>').join('');\n$('cmView').innerHTML=Object.entries(TAB_LABELS).map(([k,l])=>'<option value=\"'+esc(k)+'\">'+esc(l)+'<\/option>').join('');\n$('cmHosts').innerHTML=['nostr','mqtt','torrent'].map(k=>'<p><strong>'+esc(NAMES[k])+'<\/strong> ('+(HOSTS[k]||[]).length+' listed; the library uses a small subset): '+(HOSTS[k]||[]).map(esc).join(', ')+'<\/p>').join('')\n  +'<p><strong>STUN<\/strong> (route finding): '+(HOSTS.stun||[]).map(esc).join(', ')+'<\/p><p>Library: Trystero '+esc(VER)+' (MIT), bundled in this file. Nothing is downloaded at runtime.<\/p>';\n$('cmPeers').addEventListener('click',e=>{const b=e.target.closest('[data-mute]'); if(!b) return; const id=b.dataset.mute; S.muted.has(id)?S.muted.delete(id):S.muted.add(id); persist(); paint();});\n$('cmInviteBox').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; if(b.dataset.go&&VALID_VIEWS.includes(b.dataset.go)) switchView(b.dataset.go); S.invite=null; paint();});\n$('cmGen').addEventListener('click',()=>{\n  const w=()=>WORDS[rnd(1)[0]%WORDS.length], A='abcdefghjkmnpqrstuvwxyz23456789';\n  $('cmRoom').value=[w(),w(),w(),String(rnd(2)[0]%100)].join('-');\n  $('cmPass').value=Array.from(rnd(12),b=>A[b%A.length]).join('');\n  say('Share this code and password with the people you invite, outside this page. The password is never saved.');\n});\n$('cmJoin').addEventListener('click',connect);\n$('cmLeave').addEventListener('click',()=>leave());\n$('cmSend').addEventListener('click',sendNote);\n$('cmInvite').addEventListener('click',()=>suggest());\n$('cmForget').addEventListener('click',forget);\n$('cmText').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); sendNote();}});\nwindow.addEventListener('pagehide',()=>{if(S.room){try{S.room.leave();}catch(e){}}});\npaint();\nif(location.hash.replace(/^#\\/?/,'')==='commons') switchView('commons',{fromHash:true}); // deep link: the host read the hash before this view existed\n\n/* ---- G. OPTIONAL HOST PATCHES (safe to delete this block and #cm-patch-style) ---- */\ntry{\n  if(typeof renderAllViews==='function'){ // one malformed API payload should blank only its own section\n    const parts=[['renderOverview','panel-overview'],['renderLive','panel-live'],['renderClimateAtmosphere','panel-climate'],['renderOceans','panel-oceans'],['renderBiomeMap','panel-biomes'],['renderBiodiversity','panel-biodiversity'],['renderHumanitarian','panel-humanitarian'],['renderDevelopment','panel-development'],['renderSatellites','panel-satellites'],['renderNearResults','nearResults']];\n    window.renderAllViews=function(){\n      parts.forEach(([fn,id])=>{try{window[fn]();}catch(e){console.warn('Section failed to render:',id,e); const el=$(id); if(el) el.innerHTML='<p class=\"muted\">This section could not be drawn from the data received. Other sections are unaffected.<\/p>';}});\n      try{searchIndex=buildSearchIndex();}catch(e){}\n    };\n  }\n  if(typeof cacheClearAll==='function'){ // \"Clear all saved data\" in About also wipes Commons notes\n    const orig=window.cacheClearAll; window.cacheClearAll=async function(){await orig.apply(this,arguments); await wipe();};\n  }\n  const f=document.querySelector('.footer-note'); if(f&&!f.dataset.cm){f.dataset.cm='1'; f.append(' Commons (P2P) is opt-in and shares only what you type or choose to share.');}\n  const ac=document.querySelector('#panel-about .attrib-content');\n  if(ac&&ATTR){const d=document.createElement('div'); d.innerHTML=ATTR; const p=ac.querySelector('p:last-of-type'); p?ac.insertBefore(d,p):ac.appendChild(d);}\n}catch(e){console.warn('Commons host patches skipped',e);}\n}catch(err){console.warn('Commons add-on failed to start; the dashboard is unaffected.',err);}\n})();<\/script>\n"},
{key:"map",name:"World Map",marker:"id=\"mp-module\"",desc:"A world map of the live data the dashboard has already loaded: quakes, hazard events, alerts, your chosen place.",text:"<\u0021--\n  ============================================================================\n  WORLD MAP ADD-ON: provenance\n  ----------------------------------------------------------------------------\n  Authored by Claude (Anthropic) for the requesting user on 2026-10-14 as a companion to the\n  Civic Benevolence Dashboard. It is independent of commons-addon.html and can be merged in\n  either order. It adds one navigation item and one view (\"World Map\") and removes nothing.\n  Merge: paste this block just before the closing body tag. Remove: delete the block.\n\n  WHAT IT DRAWS\n  - Only data the dashboard has already loaded; this block makes no network request of its own.\n  - Layers: earthquakes of the last 24 h (layerStatus.earthquakes.allPoints, strongest 800),\n    NASA EONET open events (naturalEvents.events), GDACS orange/red alerts that carry a point\n    location (gdacs.events), and the place chosen under Near You (nearLocation; drawn locally,\n    never transmitted).\n  - Each layer shows the dashboard's own Live / Cached / Unavailable status, source and age; an\n    empty or unavailable layer says so rather than guessing.\n  - It redraws when those layers refresh (checked every 1.5 s, only while the view is open).\n\n  LAND OUTLINE (embedded SVG path, generated offline)\n  - Natural Earth 1:110m land (public domain) from the world-atlas npm package 2.0.2 (ISC),\n    read with topojson-client 3.1.0 (ISC); projected equirectangularly (x = lon + 180, y = 90 - lat)\n    and simplified with Douglas-Peucker at 0.4 degrees (1,962 points).\n  - SHA-256 of the path string: 713ce9f594769ea15d1d9ca31808d2349b4fedcb4179d287f568314a2728f7f0\n  - Coastlines are schematic: for orientation, not for borders or navigation.\n\n  SAFETY AND LIMITS\n  - All external text (place names, event titles) is escaped before it reaches the page; markers\n    carry text only; nothing is stored; nothing is sent. Not an alerting system.\n  - Equirectangular projection exaggerates high latitudes; small quakes are under-reported in\n    some regions; markers are not individually keyboard-focusable (the same data is listed in Live\n    Earth Monitor and Humanitarian Response, linked from the view); no zoom or pan beyond the\n    region presets.\n  - Host globals it reads: switchView, VALID_VIEWS, TAB_LABELS, layerStatus, nearLocation,\n    badgeHTML (optional). Host DOM: #mainContent, #tab-live, #panel-live. If any required one is\n    missing the block logs one line and does nothing.\n\n  EXTENSION HOOK: window.CivicMap.hooks holds functions called after every draw as f(svg, {X, Y, k}),\n  and window.CivicMap.redraw() redraws on demand; journey-addon.html draws party pings through them.\n\n  VERIFICATION\n  Before delivery: the module parses as JavaScript and was exercised in jsdom against a\n  stub of the dashboard's hooks and globals: nav and panel placement, layer plotting\n  (invalid and missing coordinates skipped, only red/orange alerts with a point\n  location), escaping of external text, marker details, layer toggles, region presets,\n  redraw on data refresh, unavailable-layer message, deep link, and the Commons section-\n  picker companion. NOT verified: rendering in a real browser, or integration with the\n  full dashboard file.\n  ============================================================================\n-->\n<style id=\"mp-style\">#mpSvg{display:block;width:100%;height:auto;max-height:70vh;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:#0d1b30}\n#panel-map .list-item-meta{margin-top:4px}\n#panel-map [data-d]{cursor:pointer}<\/style>\n<script id=\"mp-module\">/* ============================================================================\n   WORLD MAP MODULE: additive view, no network. Plots data the dashboard has ALREADY\n   loaded f2(x)+'\" cy=\"'+f2(y)+'\" r=\"'+f2(Math.min(4,Math.max(.5,(p.mag-1)*.5))*k)+'\" fill=\"'+c+'\" fill-opacity=\".55\" stroke=\"'+c+'\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"><title>'+esc(t)+'<\/title><\/circle>';}},\n {id:'hz',label:'Open natural-hazard events',key:'naturalEvents',cap:400,\n  all:d=>d.events||[],\n  text:p=>((p.categories&&p.categories[0])||'Event')+' \u00b7 '+String(p.title||''),\n  mark:(p,x,y,k,t)=>{const s=1.5*k;\n    return '<rect data-k=\"hz\" data-d=\"'+esc(t)+'\" x=\"'+f2(x-s)+'\" y=\"'+f2(y-s)+'\" width=\"'+f2(2*s)+'\" height=\"'+f2(2*s)+'\" transform=\"rotate(45 '+f2(x)+' '+f2(y)+')\" fill=\"#a78bfa\" fill-opacity=\".85\" stroke=\"#fff\" stroke-opacity=\".5\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"><title>'+esc(t)+'<\/title><\/rect>';}},\n {id:'al',label:'Disaster alerts (orange/red)',key:'gdacs',cap:400,\n  all:d=>(d.events||[]).filter(e=>/orange|red/i.test(e.alertLevel)),\n  text:p=>String(p.alertLevel).toUpperCase()+' \u00b7 '+p.type+' \u00b7 '+p.name+(p.country?' ('+p.country+')':''),\n  mark:(p,x,y,k,t)=>{const s=2*k,c=/red/i.test(p.alertLevel)?'#ef4444':'#f59e0b';\n    return '<path data-k=\"al\" data-d=\"'+esc(t)+'\" d=\"M'+f2(x)+' '+f2(y-s)+'L'+f2(x+s)+' '+f2(y+s)+'L'+f2(x-s)+' '+f2(y+s)+'Z\" fill=\"'+c+'\" fill-opacity=\".9\" stroke=\"#fff\" stroke-opacity=\".6\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"><title>'+esc(t)+'<\/title><\/path>';}}\n];\n\n/* ---- HOST WIRING: one nav item + one view; nothing existing is replaced ---- */\nconst PANEL=`\n<h2>World Map<\/h2>\n<p class=\"intro\">Everything the dashboard has already loaded, placed on a map: earthquakes from the last 24 hours, open natural-hazard events, orange and red disaster alerts, and the place you chose under Near You. Nothing new is fetched for this view.<\/p>\n<div class=\"form-row\"><label class=\"muted\">Region <select id=\"mpRegion\" class=\"select-input\"><\/select><\/label><\/div>\n<div id=\"mpLayers\" class=\"card-list\" style=\"margin-bottom:12px\"><\/div>\n<svg id=\"mpSvg\" viewBox=\"0 0 360 180\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"World map\"><\/svg>\n<p id=\"mpInfo\" class=\"status-line\" role=\"status\" aria-live=\"polite\" style=\"margin-top:10px\">Click or tap a marker for details.<\/p>\n<p class=\"fine-print\">Key: circles are earthquakes (bigger and redder means stronger), violet diamonds are open hazard events, triangles are orange or red disaster alerts, and the white ring is your chosen place. Each marker is one report from a public source, not a measure of risk. An empty area means nothing was in these feeds, not that nothing is happening. The projection stretches areas near the poles. Land outline: Natural Earth (public domain). This is not an alerting system: follow your local authorities.<\/p>\n<p class=\"fine-print\">Text versions of this data: <button type=\"button\" class=\"btn btn-secondary\" data-go=\"live\">Live Earth Monitor<\/button> <button type=\"button\" class=\"btn btn-secondary\" data-go=\"humanitarian\">Humanitarian Response<\/button><\/p>`;\nVALID_VIEWS.push('map'); TAB_LABELS.map='World Map';\nconst nav=document.createElement('button');\nnav.className='nav-item'; nav.id='tab-map'; nav.dataset.view='map';\nnav.setAttribute('role','tab'); nav.setAttribute('aria-selected','false'); nav.setAttribute('aria-controls','panel-map');\nnav.innerHTML='<span class=\"nav-dot live\"><\/span>World Map';\n($('tab-live')||document.querySelector('.nav-item')).insertAdjacentElement('afterend',nav);\nnav.addEventListener('click',()=>switchView('map'));\nconst sec=document.createElement('section');\nsec.className='view'; sec.id='panel-map'; sec.dataset.view='map'; sec.tabIndex=0;\nsec.setAttribute('role','tabpanel'); sec.setAttribute('aria-labelledby','tab-map'); sec.innerHTML=PANEL;\n($('panel-live')||$('mainContent').lastElementChild).insertAdjacentElement('afterend',sec);\n\n/* ---- DRAWING ---- */\nconst ON={eq:true,hz:true,al:true};\nfunction draw(){\n  const R=REGIONS[$('mpRegion').value]||REGIONS.world, w=R[2]-R[1], h=R[4]-R[3], k=w/360, X=lon=>lon+180, Y=lat=>90-lat;\n  let marks='', sum=[];\n  LAYERS.forEach(L=>{\n    const st=layerStatus[L.key]||{tier:'unavailable',data:null}, items=st.data?L.all(st.data):[], pts=items.filter(ok).slice(0,L.cap);\n    const tier=st.tier==='loading'?'loading':(st.data?st.tier:'unavailable');\n    $('mpS-'+L.id).innerHTML=(typeof badgeHTML==='function'?badgeHTML(tier):esc(tier))+' '+esc(st.source||'\u2014')+' \u00b7 updated '+esc(ago(st.lastUpdated))\n      +(st.data?' \u00b7 '+pts.length+' plotted'+(items.length>pts.length?' of '+items.length+(L.id==='eq'?' (strongest first)':' ('+(items.length-pts.length)+' without a point location)'):''):' \u00b7 no live or cached data right now');\n    if(ON[L.id]&&st.data){ sum.push(pts.length+' '+L.label.toLowerCase()); pts.forEach(p=>{marks+=L.mark(p,X(p.lon),Y(p.lat),k,L.text(p));}); }\n  });\n  const n=getNear();\n  if(n){const t='Your chosen place: '+n.name, x=f2(X(n.lon)), y=f2(Y(n.lat));\n    marks+='<g data-k=\"near\" data-d=\"'+esc(t)+'\"><circle cx=\"'+x+'\" cy=\"'+y+'\" r=\"'+f2(2.4*k)+'\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" vector-effect=\"non-scaling-stroke\"/><circle cx=\"'+x+'\" cy=\"'+y+'\" r=\"'+f2(.7*k)+'\" fill=\"#fff\"/><title>'+esc(t)+'<\/title><\/g>'; sum.push('your chosen place');}\n  let gr=''; for(let lo=-150;lo<=150;lo+=30) gr+='<line x1=\"'+X(lo)+'\" y1=\"0\" x2=\"'+X(lo)+'\" y2=\"180\" vector-effect=\"non-scaling-stroke\"/>';\n  for(let la=-60;la<=60;la+=30) gr+='<line x1=\"0\" y1=\"'+Y(la)+'\" x2=\"360\" y2=\"'+Y(la)+'\" vector-effect=\"non-scaling-stroke\"'+(la===0?' stroke=\"rgba(255,255,255,.18)\"':'')+'/>';\n  const svg=$('mpSvg');\n  svg.setAttribute('viewBox',(R[1]+180)+' '+(90-R[4])+' '+w+' '+h);\n  svg.setAttribute('aria-label','World map, '+R[0]+': '+(sum.join(', ')||'no layers shown')+'. Text versions are in Live Earth Monitor and Humanitarian Response.');\n  svg.innerHTML='<rect x=\"0\" y=\"0\" width=\"360\" height=\"180\" fill=\"#0d1b30\"/><g stroke=\"rgba(255,255,255,.08)\" stroke-width=\"1\">'+gr+'<\/g>'\n    +'<path data-k=\"land\" d=\"'+LAND+'\" fill=\"#1d3557\" stroke=\"#3b5b88\" stroke-width=\"1\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/>'+marks;\n  CM.hooks.forEach(f=>{try{f(svg,{X,Y,k});}catch(e){console.warn('Map hook error',e);}});\n}\n\n/* ---- CONTROLS ---- */\n$('mpRegion').innerHTML=Object.entries(REGIONS).map(([k,v])=>'<option value=\"'+k+'\">'+esc(v[0])+'<\/option>').join('');\n$('mpLayers').innerHTML=LAYERS.map(L=>'<div class=\"list-item\"><label class=\"check-row\"><input type=\"checkbox\" data-layer=\"'+L.id+'\" checked> <strong>'+esc(L.label)+'<\/strong><\/label><div class=\"list-item-meta\" id=\"mpS-'+L.id+'\"><\/div><\/div>').join('');\n$('mpLayers').addEventListener('change',e=>{const c=e.target.closest('[data-layer]'); if(c){ON[c.dataset.layer]=c.checked; draw();}});\n$('mpRegion').addEventListener('change',draw);\n$('mpSvg').addEventListener('click',e=>{const m=e.target.closest('[data-d]'); $('mpInfo').textContent=m?m.dataset.d:'Click or tap a marker for details.';});\nsec.addEventListener('click',e=>{const b=e.target.closest('button[data-go]'); if(b&&VALID_VIEWS.includes(b.dataset.go)) switchView(b.dataset.go);});\n\n/* ---- REFRESH: redraw when the dashboard's layers (or the chosen place) change; only while the view is open ---- */\nconst sig=()=>LAYERS.map(L=>{const s=layerStatus[L.key]||{}; return s.tier+':'+s.lastUpdated;}).join('|')+'|'+(getNear()?getNear().lat+','+getNear().lon:'');\nlet last='';\nsetInterval(()=>{if(!sec.classList.contains('active')) return; const s=sig(); if(s!==last){last=s; draw();}},1500);\ndraw(); last=sig();\n\n/* ---- COMPANION: let the Commons add-on's section picker offer this view (works in either merge order) ---- */\nconst cs=$('cmView'); if(cs&&!Array.from(cs.options).some(o=>o.value==='map')) cs.add(new Option('World Map','map'));\nif(location.hash.replace(/^#\\/?/,'')==='map') switchView('map',{fromHash:true}); // deep link: the host read the hash before this view existed\n}catch(err){console.warn('Map add-on failed to start; the dashboard is unaffected.',err);}\n})();<\/script>\n"},
{key:"journey",name:"Stewardship Journey",marker:"id=\"gd-module\"",desc:"Skill constellation, quests, field guide, quiz and party play. Works best with the other two.",text:"<\u0021--\n  ============================================================================\n  STEWARDSHIP JOURNEY ADD-ON: provenance\n  ----------------------------------------------------------------------------\n  Authored by Claude (Anthropic) for the requesting user on 2026-10-14 as a companion to the Civic\n  Benevolence Dashboard. It adds one navigation item (\"Journey\"), one view and a small sidebar HUD, and\n  removes nothing. It works alone; party play needs commons-addon.html and map pings need map-addon.html.\n  Any merge order works. Remove: delete the block.\n\n  DESIGN: MMO ideas, without the dark patterns\n  - Adopted: XP and levels (capped at 10), a skill tree drawn as a constellation (9 stars; each of the 8\n    skills unlocks something that works, the capstone is a title), quests, callings (classes), parties\n    (Commons rooms), co-op objectives (\"musters\"), map pings, a party roll, and \"rested\" XP (a daily cap on\n    repeatable XP that tells you to stop instead of rewarding grinding).\n  - Not adopted, on purpose: streaks, rankings or leaderboards, timers and FOMO events, loot boxes,\n    trading, PvP, public guild lists or lobbies, and any power over other players (no kick, ban or\n    moderation perks).\n  - Skill points: one at the start plus one per level (ten in all) equal the total cost of every star,\n    so nothing is scarce and nothing can be missed.\n  - XP comes from exploring, checking sources, quests and live-data quiz answers. Repeatable XP stops at\n    120 a day; quests and first visits are one-time and exempt. Wrong quiz answers cost nothing.\n  - Quiz questions are built from figures already on the page; with no live or cached data there is no\n    quiz rather than an invented question. Field Guide entries are short, sourced restatements of\n    well-established facts. The readiness checklist is self-reported, private and never shared.\n\n  DATA AND PRIVACY\n  - Progress (XP, level, skills, quests, checklist ticks, calling, the sharing switch) lives in the\n    IndexedDB database civic_dashboard_journey_v1. The Journey itself sends nothing anywhere. Reset is in\n    the panel, and the dashboard's \"Clear all saved data\" also resets it (hook on cacheClearAll).\n  - Shared with a party only on your choice: calling and level (Roll Call, off by default), your completion\n    of an objective you explicitly joined, and pings you place. Never your location, quiz results,\n    checklist, or anything from Near You.\n\n  PARTY PROTOCOL (three Trystero actions on the Commons room; names fit the 12-byte limit)\n  - \"roll\": {c: calling, l: level}; accepted only for known callings and levels 1 to 10. Titles are\n    computed locally, never taken from the sender. An invalid payload removes the sender from the roll.\n  - \"muster\": {k:'prop', n} or {k:'done', n} or {k:'snap', objs:[n], mine:[n]}; n must index a fixed catalog\n    of six objectives (no free text); at most 3 active. A snapshot only ever records the sender's own\n    completions, so nobody can mark someone else done. An objective completes when every unmuted member\n    has reported.\n  - \"ping\": {k:'look'|'ask'|'thanks', lat, lon}; numbers only, in range, rounded to 0.1 degree; 90 s\n    lifetime; at most 20 at once; one outgoing ping every 5 s.\n  - Every incoming message first passes the Commons guard (mute, 12-peer cap, per-peer rate limit).\n\n  INTEGRATION POINTS\n  - Host globals read: switchView, VALID_VIEWS, TAB_LABELS, nearLocation, layerStatus, cacheClearAll.\n    Host DOM: #mainContent, #tab-overview, #panel-overview, .sidebar-footer. Uses window.CivicCommons (v1)\n    and the window.CivicMap draw hook when present. Missing pieces give a clear message, never an error. It exposes\n    window.CivicJourney.reward(id, xp, label): a one-time reward (at most 40 XP, exempt from the daily cap)\n    that companion add-ons such as pathways-addon.html can grant.\n\n  LIMITS\n  - The game layer is local and honour-based: anyone can edit their own browser state, and it only affects\n    their own copy. Party messages are unsigned, like all Commons traffic.\n\n  VERIFICATION\n  Before delivery: the module parses as JavaScript and was exercised in jsdom together\n  with the Commons and World Map add-ons on a stub of the dashboard's hooks: nav, HUD\n  and panel placement; XP, first-visit rewards and quests; skill unlocking and\n  prerequisites (mouse and keyboard); Field Guide, quiz (right, wrong, and no data),\n  checklist and source-link tracking; the daily cap and level 10; persistence, two-step\n  reset and the Clear-all hook; and, with two simulated browsers in one Practice room,\n  the party roll, objectives (joining, completion, invalid and oversized payloads) and\n  map pings (gating, rate limit, invalid payloads, surviving redraws, clearing on\n  leave). NOT verified: real browsers (layout, the constellation on small screens,\n  click-to-ping coordinates), live relays or WebRTC between devices, or integration with\n  the full dashboard file.\n  ============================================================================\n-->\n<style id=\"gd-style\">#gdHud{width:100%;text-align:left;line-height:1.35}\n.gd-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}\n.gd-bar i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#34d399)}\n#gdToast{position:fixed;right:16px;bottom:52px;z-index:35;max-width:320px;padding:10px 14px;border-radius:10px;background:rgba(13,22,38,.97);border:1px solid rgba(96,165,250,.5);font-size:.82rem}\n#gdTree{display:block;width:100%;max-width:560px;margin:8px 0}\n#gdTree g[role=button]{cursor:pointer}\n#gdTree g[role=button]:focus-visible circle{stroke:#fff;stroke-width:3.5}\n#panel-journey .gd-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}\n#panel-journey .gd-row:last-child{border-bottom:none}\n#panel-journey .gd-done{color:#34d399}\n#panel-journey ul.gd-plain{list-style:none;margin:0}\n#panel-journey .gd-opt{display:block;width:100%;text-align:left;margin:6px 0}\n@media print{#gdToast,#gdHud{display:none!important}}<\/style>\n<script id=\"gd-module\">/* ============================================================================\n   STEWARDSHIP JOURNEY MODULE: a light, non-coercive game layer (MMO ideas, minus the dark patterns).\n   Blocks: A data (skills, quests, guide, checklist) | B state + storage | C XP, quests, tracking |\n           D skills + panels | E party play over the Commons API | F host wiring.\n   Adopted from MMOs: XP and levels (capped at 10), a skill tree (drawn as a constellation), quests,\n   callings (classes), parties (Commons rooms), co-op objectives (musters), map pings, a party roll,\n   \"rested\" XP (a daily cap that tells you to stop, instead of rewarding grinding).\n   Deliberately NOT adopted: streaks, rankings, timers, loot boxes, public guild lists, trading, PvP.\n   Extend: add a quest = one entry in QUESTS; add a skill = one node in TREE plus whatever checks owned(id).\n   Multiplayer rides on window.CivicCommons (commons-addon.html); pings draw through window.CivicMap hooks.\n   ============================================================================ */\n(function(){\n'use strict';\ntry{\nif(typeof switchView!=='function'||typeof VALID_VIEWS==='undefined'||typeof TAB_LABELS==='undefined'||!document.getElementById('mainContent')){\n  console.info('Journey add-on: host dashboard not detected; skipped.'); return;\n}\nif(document.getElementById('panel-journey')) return;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst DB='civic_dashboard_journey_v1', CAP=120, MAXL=10, need=l=>50+30*(l-1);\nconst CALLINGS=['Observer','Preparer','Educator','Steward'];\nconst ttl=(c,l,x)=>(c?c+' '+(l>=7?'III':l>=3?'II':'I'):'Newcomer')+(x?' \u2605':'');\nconst getNear=()=>{try{return (typeof nearLocation!=='undefined'&&nearLocation&&Number.isFinite(nearLocation.lat))?nearLocation:null;}catch(e){return null;}};\nconst today=()=>new Date().toLocaleDateString('en-CA');\nconst rnd=n=>crypto.getRandomValues(new Uint8Array(n));\n\n/* ---- A. DATA ---- */\nconst TREE=[\n {b:'Observer',a:-90,n:[{id:'o1',t:'Field Guide',d:'Unlocks Field Guide set I: short, sourced explainers.',c:1},{id:'o2',t:'Pop Quiz',d:'Unlocks live-data quiz questions (+XP when right, nothing lost when wrong) and Field Guide set II.',c:2,r:'o1'}]},\n {b:'Cartographer',a:0,n:[{id:'c1',t:'Pin Drop',d:'Place \"look here\" pings on the World Map for your party.',c:1},{id:'c2',t:'Signal Set',d:'Adds \"question\" and \"thanks\" pings.',c:1,r:'c1'}]},\n {b:'Preparer',a:90,n:[{id:'p1',t:'Go-bag Basics',d:'Unlocks the 5-item readiness checklist (self-reported).',c:1},{id:'p2',t:'Household Plan',d:'Extends the checklist to 8 items.',c:1,r:'p1'}]},\n {b:'Herald',a:180,n:[{id:'h1',t:'Roll Call',d:'Share your calling and level with your party (opt-in).',c:1},{id:'h2',t:'Muster',d:'Propose party objectives from the catalog.',c:2,r:'h1'}]}\n];\nconst NODES=TREE.flatMap(b=>b.n.map((n,i)=>Object.assign({b:b.b,i},n)));\nconst QUESTS=[\n {id:'q1',t:'First Light',d:'Open the Overview and the Live Earth Monitor.',xp:20,chk:()=>P.seen.overview&&P.seen.live},\n {id:'q2',t:'Know Your Place',d:'Choose a place under Near You. The Journey shares nothing about it.',xp:25,chk:()=>!!getNear()},\n {id:'q3',t:'Lay of the Land',d:'Open the World Map and select a marker.',xp:25,chk:()=>P.seen.map&&P.cnt.mk>0},\n {id:'q4',t:'Check the Sources',d:'Open 3 different source links.',xp:30,chk:()=>Object.keys(P.src).length>=3},\n {id:'q5',t:'Pop Quiz Pro',d:'Answer 3 live-data questions correctly (needs Pop Quiz).',xp:40,chk:()=>P.cnt.qok>=3},\n {id:'q6',t:'Join a Party',d:'Connect to a room under Commons (P2P).',xp:30,chk:()=>P.cnt.room>=1},\n {id:'q7',t:'Field Notes',d:'Share 2 notes with your party.',xp:30,chk:()=>P.cnt.note>=2},\n {id:'q8',t:'In Step',d:'Finish a party objective together.',xp:40,chk:()=>P.cnt.obj>=1},\n {id:'q9',t:'Ready Bag',d:'Tick 5 checklist items (self-reported).',xp:30,chk:()=>nChk()>=5},\n {id:'q10',t:'Signal Fire',d:'Send a ping on the World Map.',xp:30,chk:()=>P.cnt.ping>=1}\n];\nconst GUIDE=[\n [1,'Earthquake magnitude is logarithmic','Each whole step up the scale releases roughly 32 times more energy, so an M6 is far more than a little bigger than an M5.','USGS'],\n [1,'Live, Cached, Reference','Every figure here says how it was obtained: Live was fetched just now, Cached is the last good copy saved in your browser, Reference is hand-checked and dated.','This dashboard'],\n [1,'An anomaly is a difference, not a temperature','A temperature anomaly compares a measurement with an average from a baseline period, so +1 \u00b0C means 1 \u00b0C above that baseline.','NASA / NOAA'],\n [1,'This is not an alert system','Feeds can be delayed or incomplete. In an emergency, follow your local authorities.','Preparedness guidance'],\n [2,'The Kp index','Kp rates geomagnetic disturbance from 0 to 9; 5 or higher counts as a geomagnetic storm (G1 and up).','NOAA SWPC'],\n [2,'Air quality here is modelled','The Near You air-quality figure is a model estimate on a grid of roughly 11 to 45 km, not a reading from a nearby sensor.','Open-Meteo / Copernicus CAMS'],\n [2,'Displacement categories are not summed','UNHCR reports refugees, asylum-seekers and others as separate categories, and its headline totals include other sources, so the categories do not simply add up.','UNHCR'],\n [2,'Empty does not mean quiet','A map with few dots means few reports in these feeds. Coverage of small events varies by region.','USGS / NASA EONET']\n];\nconst CHK=['I know which official channel issues emergency alerts where I live.','I have a way to receive alerts, such as a phone setting or a battery radio.','I keep a few days of water and food at home.','My household knows where to meet if we are separated.','I keep copies of key documents and contacts somewhere safe.','I know how to shut off home utilities, or who can.','I have checked on neighbours who may need help in an emergency.','I know where official shelter or evacuation guidance is published for my area.'];\nconst CAT=[['Review the Live Earth Monitor','v:live'],['Review the World Map','v:map'],['Review Humanitarian Response','v:humanitarian'],['Try the Near You view','v:near'],['Open a source link','src'],['Answer a Pop Quiz question','quiz']];\nconst PK={look:'Look here',ask:'Question',thanks:'Thanks'};\n\n/* ---- B. STATE AND STORAGE (own IndexedDB; wiped by Reset and by the dashboard's \"Clear all saved data\") ---- */\nconst blank=()=>({xp:0,lvl:1,sp:1,skills:{},calling:'',done:{},seen:{},src:{},cnt:{mk:0,qok:0,room:0,note:0,obj:0,ping:0},chk:{},day:'',dxp:0,rested:false,share:false});\nlet P=blank(), SEL='', lastV='', ready=false;\nconst MP={ctx:null,acts:null,roster:new Map(),obj:new Map(),pings:[]};\nlet dbp=null;\nconst idb=()=>dbp||(dbp=new Promise((res,rej)=>{if(!window.indexedDB) return rej(new Error('no indexedDB')); const r=indexedDB.open(DB,1); r.onupgradeneeded=()=>r.result.createObjectStore('kv',{keyPath:'k'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}));\nconst store=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('kv',mode),rq=fn(tx.objectStore('kv')); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);})).catch(()=>null);\nlet st=0; const save=()=>{clearTimeout(st); st=setTimeout(()=>store('readwrite',s=>s.put({k:'me',v:P})),250);};\nconst owned=id=>!!P.skills[id];\nconst canBuy=n=>!owned(n.id)&&P.sp>=n.c&&(!n.r||owned(n.r));\nconst capstone=()=>NODES.every(n=>owned(n.id));\nconst nChk=()=>Object.values(P.chk).filter(Boolean).length;\nconst tell=(a,d,t)=>{try{Promise.resolve(a.send(d,t?{target:t}:undefined)).catch(()=>{});}catch(e){}};\n\n/* ---- C. XP, QUESTS, TRACKING ---- */\nconst LOG=[]; let tt=0;\nfunction toast(m){LOG.unshift(m); LOG.length=Math.min(LOG.length,6); const t=$('gdToast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{t.hidden=true;},4500); const l=$('gdLog'); if(l) l.innerHTML=LOG.map(x=>'<li>'+esc(x)+'<\/li>').join('');}\nfunction award(n,why,free){ // free = one-time rewards (quests, first visits) are exempt from the daily cap\n  if(P.day!==today()){P.day=today(); P.dxp=0; P.rested=false;}\n  let g=n; if(!free){g=Math.min(n,Math.max(0,CAP-P.dxp)); if(g<=0){ if(!P.rested){P.rested=true; toast('Well rested: today\\'s XP is full. Nothing is lost; more tomorrow.');} save(); return 0; } P.dxp+=g;}\n  if(P.lvl>=MAXL){P.xp=Math.min(P.xp+g,need(MAXL)); toast('+'+g+' XP \u00b7 '+why+' \u00b7 max level'); save(); paintAll(); return g;}\n  P.xp+=g; toast('+'+g+' XP \u00b7 '+why);\n  while(P.lvl<MAXL&&P.xp>=need(P.lvl)){P.xp-=need(P.lvl); P.lvl++; P.sp++; toast('Level '+P.lvl+'! +1 skill point');}\n  save(); paintAll(); return g;\n}\nfunction check(){QUESTS.forEach(q=>{if(!P.done[q.id]&&q.chk()){P.done[q.id]=1; toast('Quest complete: '+q.t); award(q.xp,q.t,true);}});}\nconst EV={}; const ev=k=>{EV[k]=Date.now();};\nfunction onView(v){lastV=v; if(!P.seen[v]){P.seen[v]=1; award(5,'explored '+(TAB_LABELS[v]||v),true);} ev('v:'+v); check(); autoDone(); save(); paintAll();}\n\n/* ---- D. SKILLS AND PANELS ---- */\nconst PANEL=`\n<h2>Stewardship Journey<\/h2>\n<p class=\"intro\">A light game layer over real learning. You earn experience by exploring the dashboard, checking sources and, if you choose, working with a party. There are no streaks, rankings, timers or loot boxes, and nothing is lost by skipping a day. Progress is saved only in this browser.<\/p>\n<div class=\"facts-card\">\n  <div class=\"card-header\"><h3 id=\"gdName\">Newcomer<\/h3><span class=\"badge\" id=\"gdLvl\"><\/span><\/div>\n  <div id=\"gdXp\" class=\"muted\"><\/div><div class=\"gd-bar\"><i id=\"gdBar2\" style=\"width:0\"><\/i><\/div>\n  <div class=\"form-row\" style=\"margin-top:12px\"><label class=\"muted\">Calling <select id=\"gdCalling\" class=\"select-input\"><option value=\"\">Choose a calling\u2026<\/option><\/select><\/label><span id=\"gdSp\" class=\"muted\"><\/span><\/div>\n  <p class=\"fine-print\">A calling is a flavour, not a rule: it sets your title, and appears on your party roll only if you share it.<\/p>\n<\/div>\n<details class=\"sources-details\" open><summary>Skill constellation<\/summary>\n  <p class=\"fine-print\" style=\"margin-top:10px\">Spend skill points (one per level, plus one to start: ten in all, enough for every star). Each star unlocks something that works. Select a star to read it.<\/p>\n  <svg id=\"gdTree\" viewBox=\"0 0 320 230\" role=\"group\" aria-label=\"Skill constellation: four branches of two skills around a capstone\"><\/svg>\n  <div id=\"gdNode\" class=\"list-item\" aria-live=\"polite\"><\/div><\/details>\n<details class=\"sources-details\" open><summary>Quests<\/summary><ul id=\"gdQuests\" class=\"gd-plain\" style=\"margin-top:10px\"><\/ul><\/details>\n<details class=\"sources-details\" open><summary>Party<\/summary><div id=\"gdParty\" style=\"margin-top:10px\"><\/div><\/details>\n<details class=\"sources-details\"><summary>Field Guide<\/summary><div id=\"gdGuide\" style=\"margin-top:10px\"><\/div><\/details>\n<details class=\"sources-details\"><summary>Pop Quiz<\/summary><div id=\"gdQuiz\" style=\"margin-top:10px\"><\/div><\/details>\n<details class=\"sources-details\"><summary>Readiness checklist<\/summary><div id=\"gdChk\" style=\"margin-top:10px\"><\/div><\/details>\n<details class=\"sources-details\"><summary>Recent activity, what is shared, and reset<\/summary><div class=\"howto-content\" style=\"margin-top:10px\">\n  <ul id=\"gdLog\" class=\"gd-plain\"><\/ul>\n  <p>Experience comes from exploring, checking sources, quests and quizzes. Repeatable XP stops at 120 a day (\"rested\"); quests and first visits are one-time and exempt. Level 10 is the end of the road.<\/p>\n  <p>Shared with a party only if you choose: your calling and level (Roll Call), your completion of an objective you joined, and pings you place. Nothing about your location is ever shared by the Journey. Data lives only in this browser; \"Clear all saved data\" also resets it.<\/p>\n  <div id=\"gdResetArea\"><\/div><\/div><\/details>`;\n\nconst nodeLabel=(n)=>n.b+' tier '+(n.i+1)+': '+n.t+', '+(owned(n.id)?'unlocked':canBuy(n)?'available, cost '+n.c:'locked');\nconst pos=(b,i)=>{const r=[48,88][i], a=b.a*Math.PI/180; return [160+r*Math.cos(a),115+r*Math.sin(a)];};\nfunction paintTree(){\n  let ln='',nd='';\n  TREE.forEach(b=>{let px=160,py=115; b.n.forEach((n,i)=>{const [x,y]=pos(b,i), s=owned(n.id)?'o':canBuy(n)?'r':'l', sel=SEL===n.id;\n    ln+='<line x1=\"'+px.toFixed(1)+'\" y1=\"'+py.toFixed(1)+'\" x2=\"'+x.toFixed(1)+'\" y2=\"'+y.toFixed(1)+'\" stroke=\"'+(owned(n.id)?'#fbbf24':'rgba(148,163,184,.35)')+'\" stroke-width=\"1.5\"/>'; px=x; py=y;\n    nd+='<g role=\"button\" tabindex=\"0\" data-n=\"'+n.id+'\" aria-label=\"'+esc(nodeLabel(Object.assign({b:b.b,i},n)))+'\"><circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y.toFixed(1)+'\" r=\"9\" fill=\"'+(s==='o'?'#fbbf24':s==='r'?'#1e3a5f':'#1f2937')+'\" stroke=\"'+(sel?'#fff':s==='r'?'#60a5fa':s==='o'?'#fde68a':'#475569')+'\" stroke-width=\"'+(sel?3:1.5)+'\"/><text x=\"'+x.toFixed(1)+'\" y=\"'+(y+21).toFixed(1)+'\" text-anchor=\"middle\" font-size=\"8\" fill=\"#cbd5e1\">'+esc(n.t)+'<\/text><\/g>';});});\n  const cp=capstone();\n  nd+='<g aria-hidden=\"true\"><circle cx=\"160\" cy=\"115\" r=\"11\" fill=\"'+(cp?'#fbbf24':'#1f2937')+'\" stroke=\"'+(cp?'#fff':'#475569')+'\" stroke-width=\"1.5\"/><text x=\"160\" y=\"100\" text-anchor=\"middle\" font-size=\"8\" fill=\"#cbd5e1\">'+(cp?'Steward of the Commons':'Capstone')+'<\/text><\/g>';\n  $('gdTree').innerHTML=ln+nd;\n  const n=NODES.find(x=>x.id===SEL);\n  $('gdNode').innerHTML=n?('<div class=\"list-item-title\">'+esc(n.b+' \u00b7 '+n.t)+'<\/div><div class=\"fine-print\" style=\"margin:4px 0 8px\">'+esc(n.d)+' Cost: '+n.c+' point'+(n.c>1?'s':'')+'.'+(n.r&&!owned(n.r)?' Needs '+esc(NODES.find(x=>x.id===n.r).t)+' first.':'')+'<\/div>'+(owned(n.id)?'<span class=\"gd-done\">Unlocked<\/span>':'<button id=\"gdBuy\" class=\"btn\" type=\"button\"'+(canBuy(n)?'':' disabled')+'>Unlock for '+n.c+'<\/button>')):'<span class=\"muted\">'+(capstone()?'Every star is lit: Steward of the Commons.':'Select a star to see what it does.')+'<\/span>';\n}\nfunction paintHud(){\n  const x=need(P.lvl), t=ttl(P.calling,P.lvl,capstone());\n  $('gdHud').innerHTML='Lv '+P.lvl+' \u00b7 '+esc(t)+'<br><span class=\"muted\">'+(P.lvl>=MAXL?'Max level':P.xp+'/'+x+' XP')+(P.sp?' \u00b7 '+P.sp+' point'+(P.sp>1?'s':'')+' to spend':'')+'<\/span><div class=\"gd-bar\"><i style=\"width:'+(P.lvl>=MAXL?100:Math.round(100*P.xp/x))+'%\"><\/i><\/div>';\n  $('gdName').textContent=t; $('gdLvl').textContent='Level '+P.lvl; $('gdXp').textContent=P.lvl>=MAXL?'Max level reached.':P.xp+' / '+x+' XP to level '+(P.lvl+1);\n  $('gdBar2').style.width=(P.lvl>=MAXL?100:Math.round(100*P.xp/x))+'%'; $('gdSp').textContent='Skill points: '+P.sp; $('gdCalling').value=P.calling;\n}\nfunction paintQuests(){$('gdQuests').innerHTML=QUESTS.map(q=>'<li class=\"gd-row\"><span><strong>'+esc(q.t)+'<\/strong><br><span class=\"muted\">'+esc(q.d)+'<\/span><\/span><span class=\"'+(P.done[q.id]?'gd-done':'muted')+'\">'+(P.done[q.id]?'Done \u2713':'+'+q.xp+' XP')+'<\/span><\/li>').join('');}\nfunction paintGuide(){\n  const tier=owned('o2')?2:owned('o1')?1:0;\n  $('gdGuide').innerHTML=tier?GUIDE.filter(g=>g[0]<=tier).map(g=>'<div class=\"gd-row\"><span><strong>'+esc(g[1])+'<\/strong><br><span class=\"muted\">'+esc(g[2])+'<\/span><\/span><span class=\"fine-print\" style=\"margin:0\">'+esc(g[3])+'<\/span><\/div>').join('')+(tier<2?'<p class=\"fine-print\">Set II unlocks with Pop Quiz.<\/p>':''):'<p class=\"muted\">Unlock Field Guide in the Observer branch.<\/p>';\n}\nfunction paintChk(){\n  const n=owned('p2')?8:owned('p1')?5:0;\n  $('gdChk').innerHTML=n?CHK.slice(0,n).map((t,i)=>'<label class=\"check-row\"><input type=\"checkbox\" data-ci=\"'+i+'\"'+(P.chk[i]?' checked':'')+'> '+esc(t)+'<\/label>').join('')+'<p class=\"fine-print\">Self-reported and private: ticking is on the honour system and is never shared.'+(n<8?' Household Plan adds three more.':'')+'<\/p>':'<p class=\"muted\">Unlock Go-bag Basics in the Preparer branch.<\/p>';\n}\nlet QZ=null, lastQ=0;\nconst shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(1)[0]%(i+1); [a[i],a[j]]=[a[j],a[i]];} return a;};\nfunction makeQuiz(){\n  const eq=((typeof layerStatus!=='undefined'&&layerStatus.earthquakes)||{}).data, hz=((typeof layerStatus!=='undefined'&&layerStatus.naturalEvents)||{}).data, out=[];\n  if(eq&&eq.points&&eq.points.length){const t=Math.round(eq.points[0].mag*10)/10; out.push({q:'What was the strongest earthquake magnitude reported in the last 24 hours (from the Live Earth Monitor feed)?',a:'M'+t.toFixed(1),o:shuffle(['M'+t.toFixed(1),'M'+(Math.round((t+.9)*10)/10).toFixed(1),'M'+Math.max(1,Math.round((t-1.1)*10)/10).toFixed(1)])});}\n  if(hz&&hz.counts){const e=Object.entries(hz.counts).sort((a,b)=>b[1]-a[1]); if(e.length>=3&&e[0][1]>e[1][1]) out.push({q:'Which category has the most open events in NASA EONET right now?',a:e[0][0],o:shuffle(e.slice(0,3).map(x=>x[0]))});}\n  return out;\n}\nfunction paintQuiz(){\n  if(!owned('o2')){$('gdQuiz').innerHTML='<p class=\"muted\">Unlock Pop Quiz in the Observer branch.<\/p>'; return;}\n  let h='<button id=\"gdQuizNew\" class=\"btn\" type=\"button\">New question<\/button>';\n  if(QZ==='none') h+='<p class=\"muted\" style=\"margin-top:8px\">No live or cached data to ask about right now, so there is no quiz. Nothing is made up.<\/p>';\n  else if(QZ) h+='<p style=\"margin:10px 0 4px\">'+esc(QZ.q)+'<\/p>'+QZ.o.map(o=>'<button type=\"button\" class=\"btn btn-secondary gd-opt\" data-opt=\"'+esc(o)+'\"'+(QZ.fb?' disabled':'')+'>'+esc(o)+'<\/button>').join('')+(QZ.fb?'<p class=\"fine-print\">'+esc(QZ.fb)+'<\/p>':'');\n  $('gdQuiz').innerHTML=h;\n}\nfunction paintAll(){ if(!ready) return; paintHud(); paintTree(); paintQuests(); paintGuide(); paintChk(); paintQuiz(); paintParty(); }\nfunction buy(id){const n=NODES.find(x=>x.id===id); if(!n||!canBuy(n)) return; P.sp-=n.c; P.skills[id]=1; toast('Unlocked: '+n.t); save(); paintAll(); check();}\n\n/* ---- E. PARTY PLAY: runs on the Commons room (window.CivicCommons). Every message is validated; nothing is sent unless you chose to. ---- */\nconst members=()=>MP.ctx?[MP.ctx.self].concat(MP.ctx.peers().filter(id=>!MP.ctx.isMuted(id))):[];\nfunction sendRoll(target,force){const on=owned('h1')&&P.share&&P.calling; if(MP.acts&&(on||force)) tell(MP.acts.roll,on?{c:P.calling,l:P.lvl}:{c:'',l:0},target);}\nfunction addObj(n,by){if(!Number.isInteger(n)||n<0||n>=CAT.length) return null; if(!MP.obj.has(n)){ if(MP.obj.size>=3) return null; MP.obj.set(n,{by,t0:Date.now(),done:new Set(),joined:false,fin:false}); } return MP.obj.get(n);}\nfunction autoDone(){ // report completion only for objectives you joined\n  if(!MP.ctx) return; let ch=false;\n  MP.obj.forEach((o,n)=>{if(o.joined&&!o.done.has(MP.ctx.self)&&(EV[CAT[n][1]]||0)>=o.t0){o.done.add(MP.ctx.self); tell(MP.acts.muster,{k:'done',n}); ch=true;}});\n  if(ch) evalObjs();\n}\nfunction evalObjs(){\n  const c=MP.ctx; if(!c) return; const m=members();\n  MP.obj.forEach((o,n)=>{if(!o.fin&&m.length>=2&&m.every(x=>o.done.has(x))){o.fin=true; toast('In step: '+CAT[n][0]+' completed together.'); if(o.done.has(c.self)){P.cnt.obj++; award(15,'party objective',true); check(); save();}}});\n  paintParty();\n}\nfunction addPing(id,k,lat,lon){MP.pings.push({id,k,lat,lon,exp:Date.now()+90000}); if(MP.pings.length>20) MP.pings.shift(); if(window.CivicMap&&window.CivicMap.redraw) window.CivicMap.redraw();}\nlet lastPing=0;\nfunction sendPing(kind,lat,lon){\n  const c=MP.ctx, set=t=>{const m=$('gdPingMsg'); if(m) m.textContent=t||'';};\n  if(!c){set('Join a party first.'); return false;}\n  if(!PK[kind]||!(kind==='look'?owned('c1'):owned('c2'))){set('That ping needs a skill you have not unlocked.'); return false;}\n  if(!(Math.abs(lat)<=90&&Math.abs(lon)<=180)) return false;\n  const now=Date.now(); if(now-lastPing<5000){set('One ping every few seconds.'); return false;} lastPing=now;\n  lat=Math.round(lat*10)/10; lon=Math.round(lon*10)/10;\n  tell(MP.acts.ping,{k:kind,lat,lon}); addPing(c.self,kind,lat,lon); P.cnt.ping++; check(); save(); set(PK[kind]+' sent.'); return true;\n}\nfunction paintParty(){\n  const el=$('gdParty'); if(!el) return;\n  if(!window.CivicCommons){el.innerHTML='<p class=\"muted\">Party play needs the Commons add-on. Without it, everything else here still works.<\/p>'; return;}\n  if(!MP.ctx){el.innerHTML='<p class=\"muted\">Not in a party. Join or create a private room under Commons (P2P); the room is your party. Nothing is shared until you opt in below.<\/p>'; return;}\n  const c=MP.ctx, ps=c.peers();\n  let h='<div class=\"gd-row\"><span>You: '+esc(ttl(P.calling,P.lvl,capstone()))+'<\/span><label class=\"check-row\"><input type=\"checkbox\" id=\"gdShare\"'+(P.share?' checked':'')+(owned('h1')&&P.calling?'':' disabled')+'> Share my calling and level'+(owned('h1')?(P.calling?'':' (choose a calling first)'):' (unlock Roll Call)')+'<\/label><\/div><div id=\"gdRoster\">';\n  h+=ps.length?ps.map(id=>{const r=MP.roster.get(id); return '<div class=\"gd-row\"><span>Peer '+esc(String(id).slice(0,4))+(c.isMuted(id)?' (muted)':'')+': '+(r?esc(ttl(r.c,r.l))+' \u00b7 Lv '+r.l:'<span class=\"muted\">not sharing<\/span>')+'<\/span><\/div>';}).join(''):'<p class=\"muted\">Waiting for others to join the room.<\/p>';\n  h+='<\/div><h4 style=\"margin:14px 0 4px\">Party objective
