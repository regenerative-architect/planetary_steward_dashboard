s<\/h4>';\n  h+=MP.obj.size?Array.from(MP.obj).map(([n,o])=>'<div class=\"gd-row\"><span>'+esc(CAT[n][0])+'<br><span class=\"muted\">'+o.done.size+' of '+members().length+' reported'+(o.fin?' \u00b7 completed together':'')+'<\/span><\/span>'+(o.joined?'<span class=\"'+(o.done.has(c.self)?'gd-done':'muted')+'\">'+(o.done.has(c.self)?'You: done \u2713':'Joined')+'<\/span>':'<button type=\"button\" class=\"btn btn-secondary\" data-join=\"'+n+'\">Join (reports your completion)<\/button>')+'<\/div>').join(''):'<p class=\"muted\">No objectives yet.<\/p>';\n  h+='<div class=\"form-row\" style=\"margin-top:10px\"><select id=\"gdCat\" class=\"select-input\" aria-label=\"Objective\">'+CAT.map((x,i)=>'<option value=\"'+i+'\">'+esc(x[0])+'<\/option>').join('')+'<\/select><button id=\"gdProp\" class=\"btn\" type=\"button\"'+(owned('h2')&&MP.obj.size<3?'':' disabled')+'>Propose'+(owned('h2')?'':' (unlock Muster)')+'<\/button><\/div>';\n  h+='<p class=\"fine-print\">Pings: '+(owned('c1')?'use Ping mode on the World Map.':'unlock Pin Drop to ping the map.')+'<\/p>';\n  el.innerHTML=h;\n}\nfunction hookCC(CC){\n  CC.onConnect(c=>{\n    const a={roll:c.makeAction('roll'),muster:c.makeAction('muster'),ping:c.makeAction('ping')};\n    MP.ctx=c; MP.acts=a; MP.roster.clear(); MP.obj.clear(); MP.pings=[]; P.cnt.room++; check(); save();\n    c.onPeerJoin(id=>{sendRoll(id); tell(a.muster,{k:'snap',objs:Array.from(MP.obj.keys()),mine:Array.from(MP.obj).filter(([n,o])=>o.done.has(c.self)).map(([n])=>n)},id); paintParty();});\n    c.onPeerLeave(id=>{MP.roster.delete(id); MP.obj.forEach(o=>o.done.delete(id)); evalObjs();});\n    a.roll.onMessage=(d,x)=>{if(!c.ok(x.peerId,'r',4,20000)) return; if(d&&CALLINGS.includes(d.c)&&Number.isInteger(d.l)&&d.l>=1&&d.l<=MAXL) MP.roster.set(x.peerId,{c:d.c,l:d.l}); else MP.roster.delete(x.peerId); paintParty();};\n    a.muster.onMessage=(d,x)=>{\n      if(!d||typeof d!=='object'||!c.ok(x.peerId,'m',12,20000)) return;\n      if(d.k==='prop'){const o=addObj(d.n,x.peerId); if(o&&((CAT[d.n][1]==='v:'+lastV))) ev(CAT[d.n][1]);}\n      else if(d.k==='done'){const o=MP.obj.get(d.n); if(o) o.done.add(x.peerId);}\n      else if(d.k==='snap'){(Array.isArray(d.objs)?d.objs.slice(0,3):[]).forEach(n=>addObj(n,x.peerId)); (Array.isArray(d.mine)?d.mine.slice(0,3):[]).forEach(n=>{const o=MP.obj.get(n); if(o) o.done.add(x.peerId);});} // only the sender's own completions are taken from a snapshot\n      else return;\n      evalObjs();};\n    a.ping.onMessage=(d,x)=>{if(!c.ok(x.peerId,'g',3,15000)||!d||!PK[d.k]||typeof d.lat!=='number'||typeof d.lon!=='number'||!(Math.abs(d.lat)<=90&&Math.abs(d.lon)<=180)) return; addPing(x.peerId,d.k,Math.round(d.lat*10)/10,Math.round(d.lon*10)/10);};\n    paintParty();\n  });\n  CC.onLeave(()=>{MP.ctx=null; MP.acts=null; MP.roster.clear(); MP.obj.clear(); MP.pings=[]; paintParty(); if(window.CivicMap&&window.CivicMap.redraw) window.CivicMap.redraw();});\n  CC.onNote(()=>{P.cnt.note++; award(3,'shared a note'); check(); save();});\n  paintParty();\n}\n// Map pings are drawn through the World Map add-on's draw hook, so they survive every redraw.\nconst CM=(window.CivicMap=window.CivicMap||{}); CM.hooks=CM.hooks||[];\nfunction ensurePingRow(){\n  if($('gdPingRow')||!$('mpLayers')) return;\n  const d=document.createElement('div'); d.id='gdPingRow'; d.className='form-row';\n  d.innerHTML='<label class=\"check-row\"><input type=\"checkbox\" id=\"gdPingOn\"> Ping mode: click the map to ping your party<\/label><select id=\"gdPingKind\" class=\"select-input\" aria-label=\"Ping type\"><\/select><span id=\"gdPingMsg\" class=\"muted\" role=\"status\"><\/span>';\n  $('mpLayers').insertAdjacentElement('afterend',d);\n}\nfunction fillPingKinds(){const s=$('gdPingKind'); if(!s) return; s.innerHTML=Object.entries(PK).filter(([k])=>k==='look'?owned('c1'):owned('c2')).map(([k,v])=>'<option value=\"'+k+'\">'+v+'<\/option>').join(''); const on=$('gdPingOn'); if(on) on.disabled=!s.options.length||!MP.ctx; const m=$('gdPingMsg'); if(m&&!m.textContent) m.textContent=!owned('c1')?'Unlock Pin Drop to ping.':!MP.ctx?'Join a party to ping.':'';}\nCM.hooks.push((svg,m)=>{\n  ensurePingRow(); fillPingKinds();\n  const live=MP.pings.filter(p=>p.exp>Date.now());\n  svg.insertAdjacentHTML('beforeend',live.map(p=>{const x=m.X(p.lon).toFixed(2), y=m.Y(p.lat).toFixed(2), t=PK[p.k]+' \u00b7 peer '+String(p.id).slice(0,4);\n    return '<g data-k=\"ping\" data-d=\"'+esc(t)+'\"><circle cx=\"'+x+'\" cy=\"'+y+'\" r=\"'+(3*m.k).toFixed(2)+'\" fill=\"none\" stroke=\"#34d399\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"/><circle cx=\"'+x+'\" cy=\"'+y+'\" r=\"'+(.9*m.k).toFixed(2)+'\" fill=\"#34d399\"/><title>'+esc(t)+'<\/title><\/g>';}).join(''));\n});\n\n/* ---- F. HOST WIRING ---- */\nVALID_VIEWS.push('journey'); TAB_LABELS.journey='Journey';\nconst nav=document.createElement('button');\nnav.className='nav-item'; nav.id='tab-journey'; nav.dataset.view='journey';\nnav.setAttribute('role','tab'); nav.setAttribute('aria-selected','false'); nav.setAttribute('aria-controls','panel-journey');\nnav.innerHTML='<span class=\"nav-dot\"><\/span>Journey';\n($('tab-overview')||document.querySelector('.nav-item')).insertAdjacentElement('afterend',nav);\nnav.addEventListener('click',()=>switchView('journey'));\nconst sec=document.createElement('section');\nsec.className='view'; sec.id='panel-journey'; sec.dataset.view='journey'; sec.tabIndex=0;\nsec.setAttribute('role','tabpanel'); sec.setAttribute('aria-labelledby','tab-journey'); sec.innerHTML=PANEL;\n($('panel-overview')||$('mainContent').firstElementChild).insertAdjacentElement('afterend',sec);\nconst hud=document.createElement('button'); hud.id='gdHud'; hud.type='button'; hud.className='refresh-btn'; hud.setAttribute('aria-label','Open your Journey');\nconst sf=document.querySelector('.sidebar-footer'); if(sf) sf.insertBefore(hud,sf.firstChild); else document.body.appendChild(hud);\nhud.addEventListener('click',()=>switchView('journey'));\nconst toastEl=document.createElement('div'); toastEl.id='gdToast'; toastEl.setAttribute('role','status'); toastEl.setAttribute('aria-live','polite'); toastEl.hidden=true; document.body.appendChild(toastEl);\n$('gdCalling').insertAdjacentHTML('beforeend',CALLINGS.map(c=>'<option>'+c+'<\/option>').join(''));\n\n$('gdCalling').addEventListener('change',e=>{P.calling=CALLINGS.includes(e.target.value)?e.target.value:''; save(); paintAll(); if(MP.ctx) sendRoll(undefined,true);});\n$('gdTree').addEventListener('click',e=>{const g=e.target.closest('[data-n]'); if(g){SEL=g.dataset.n; paintTree();}});\n$('gdTree').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ') return; const g=e.target.closest('[data-n]'); if(g){e.preventDefault(); SEL=g.dataset.n; paintTree(); const k=document.querySelector('#gdTree [data-n=\"'+SEL+'\"]'); if(k&&k.focus) k.focus();}});\n$('gdNode').addEventListener('click',e=>{if(e.target.id==='gdBuy') buy(SEL);});\n$('gdChk').addEventListener('change',e=>{const i=e.target.dataset&&e.target.dataset.ci; if(i===undefined) return; P.chk[i]=e.target.checked; check(); save(); paintAll();});\n$('gdQuiz').addEventListener('click',e=>{\n  const b=e.target.closest('button'); if(!b) return;\n  if(b.id==='gdQuizNew'){ if(Date.now()-lastQ<1500) return; lastQ=Date.now(); const l=makeQuiz(); QZ=l.length?l[rnd(1)[0]%l.length]:'none'; paintQuiz(); }\n  else if(b.dataset.opt!==undefined&&QZ&&QZ!=='none'&&!QZ.fb){\n    ev('quiz');\n    if(b.dataset.opt===QZ.a){P.cnt.qok++; QZ.fb='Correct. +10 XP (counts toward the daily limit).'; award(10,'quiz answer');} else QZ.fb='Not quite: the answer is '+QZ.a+'. No points lost.';\n    check(); autoDone(); save(); paintQuiz();\n  }\n});\n$('gdParty').addEventListener('change',e=>{if(e.target.id==='gdShare'){P.share=e.target.checked; save(); sendRoll(undefined,true);}});\n$('gdParty').addEventListener('click',e=>{\n  const b=e.target.closest('button'); if(!b||!MP.ctx) return;\n  if(b.dataset.join!==undefined){const o=MP.obj.get(+b.dataset.join); if(o){o.joined=true; autoDone(); paintParty();}}\n  else if(b.id==='gdProp'&&owned('h2')){const n=+$('gdCat').value, o=addObj(n,MP.ctx.self); if(o){tell(MP.acts.muster,{k:'prop',n}); if(CAT[n][1]==='v:'+lastV) ev(CAT[n][1]); paintParty();}}\n});\nfunction resetArea(){\n  const a=$('gdResetArea'); a.innerHTML='<button id=\"gdReset\" class=\"btn btn-secondary\" type=\"button\">Reset my Journey\u2026<\/button>';\n  $('gdReset').addEventListener('click',()=>{a.innerHTML='<span class=\"muted\">Erase all progress in this browser?<\/span> <button id=\"gdResetYes\" class=\"btn btn-danger\" type=\"button\">Yes, reset<\/button> <button id=\"gdResetNo\" class=\"btn btn-secondary\" type=\"button\">Cancel<\/button>'; $('gdResetNo').addEventListener('click',resetArea); $('gdResetYes').addEventListener('click',async()=>{await reset(); resetArea(); toast('Journey reset.');});});\n}\nasync function reset(){clearTimeout(st); await store('readwrite',s=>s.clear()); P=blank(); SEL=''; QZ=null; paintAll();}\nif(typeof cacheClearAll==='function'){const o=window.cacheClearAll; window.cacheClearAll=async function(){await o.apply(this,arguments); await reset();};}\ndocument.addEventListener('click',e=>{ // distinct source links opened, and map markers selected\n  const t=e.target; if(!t||!t.closest) return;\n  const a=t.closest('#mainContent a[target=\"_blank\"]'); if(a&&a.href&&Object.keys(P.src).length<50){P.src[a.href]=1; ev('src'); check(); autoDone(); save(); paintAll();}\n  if(t.closest('#mpSvg')){\n    if(t.closest('[data-d]')){P.cnt.mk++; check(); save();}\n    else{const on=$('gdPingOn'), svg=$('mpSvg'); if(on&&on.checked&&svg.getScreenCTM&&svg.getScreenCTM()){const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse()); sendPing($('gdPingKind').value,90-p.y,p.x-180);}}\n  }\n});\nwindow.CivicJourney={v:1,get ready(){return ready;},ping:sendPing,state:()=>JSON.parse(JSON.stringify(P)),\n  reward:(id,xp,label)=>{id='x:'+String(id).slice(0,60); xp=Math.min(40,Math.floor(+xp)||0); if(!ready||xp<=0||P.done[id]) return false; P.done[id]=1; award(xp,String(label||'reward').slice(0,40),true); save(); return true;}}; // one-time, at most 40 XP, for companion add-ons\n\nstore('readonly',s=>s.get('me')).then(r=>{\n  if(r&&r.v) P=Object.assign(blank(),r.v,{cnt:Object.assign(blank().cnt,r.v.cnt)});\n  ready=true; resetArea(); paintAll(); if(CM.redraw) CM.redraw(); // adds the ping controls to the map panel\n  const cur=document.querySelector('#mainContent .view.active'); if(cur&&cur.dataset.view) onView(cur.dataset.view);\n  new MutationObserver(()=>{const a=document.querySelector('#mainContent .view.active'), v=a&&a.dataset.view; if(v&&v!==lastV) onView(v);}).observe($('mainContent'),{attributes:true,attributeFilter:['class'],subtree:true});\n  setInterval(()=>{check(); const n=MP.pings.length; MP.pings=MP.pings.filter(p=>p.exp>Date.now()); if(n!==MP.pings.length&&window.CivicMap&&window.CivicMap.redraw) window.CivicMap.redraw();},2000);\n  let tries=0; const tryCC=()=>{if(window.CivicCommons){hookCC(window.CivicCommons); return;} if(++tries<20) setTimeout(tryCC,500); else paintParty();}; tryCC();\n  if(location.hash.replace(/^#\\/?/,'')==='journey') switchView('journey',{fromHash:true});\n});\n}catch(err){console.warn('Journey add-on failed to start; the dashboard is unaffected.',err);}\n})();<\/script>\n"},
{key:"paths",name:"Guided Pathways",marker:"id=\"pw-module\"",desc:"A first-visit welcome and four role-based routes with outcomes; steps tick themselves and earn Journey XP.",text:"<\u0021--\n  ============================================================================\n  GUIDED PATHWAYS ADD-ON: provenance\n  ----------------------------------------------------------------------------\n  Authored by Claude (Anthropic) for the requesting user on 2026-10-14 as a companion to the Civic\n  Benevolence Dashboard. It adds one navigation item (\"Pathways\"), one view and a first-visit welcome\n  dialog, and removes nothing. It works alone and uses the other add-ons when they are present. Any\n  merge order works. Remove: delete the block.\n\n  PURPOSE\n  - \"Example workflows or interaction pathways\" with stated outcomes: four short routes (Teach with it,\n    Prepare my household, Brief a decision-maker, Join the effort), each step saying what to do and what\n    you will be able to do afterwards. The welcome dialog offers the routes once, on a first visit; it is\n    skippable (button or Escape), never shown on a deep link, and replayable from the Pathways view.\n  - Steps tick themselves on an event (a section opened, a source link opened, a place chosen, the data\n    snapshot shown, a Commons room joined, a note shared). That records that you looked, not that you\n    understood, which the page says plainly; any step can also be ticked by hand.\n  - Steps that need the Commons or Journey add-ons are hidden when those are absent, and a step whose\n    section is not installed shows no Open button.\n  - The text is guidance, not advice. It points to official sources and says the dashboard is not an\n    alert system.\n\n  DATA AND PRIVACY\n  - Progress (events seen, manual ticks, rewards given, whether the welcome was shown) lives in the\n    IndexedDB database civic_dashboard_paths_v1; nothing is sent anywhere. Reset is in the Pathways\n    view, and the dashboard's \"Clear all saved data\" resets it too (hook on cacheClearAll).\n  - The only thing that can reach other people is a section suggestion, sent by pressing \"Suggest to my\n    party\" on a step, through the Commons room's existing suggestion channel.\n\n  INTEGRATION POINTS\n  - Host globals read: switchView, VALID_VIEWS, TAB_LABELS, nearLocation, cacheClearAll. Host DOM:\n    #mainContent, #tab-overview, #panel-overview, links with target _blank inside the main area, and\n    #snapshotBtn. Optional: window.CivicJourney.reward (one-time XP: 8 per step, 25 per pathway) and\n    window.CivicCommons (onConnect, onNote, onLeave, state, suggest).\n  - Missing pieces degrade quietly: no error, just fewer automatic ticks.\n\n  LIMITS\n  - Event detection is generous by design: it cannot know whether anyone read anything.\n\n  VERIFICATION\n  Before delivery: the module parses as JavaScript and was exercised in jsdom with the\n  other add-ons on a stub of the dashboard's hooks: the first-visit welcome (dialog\n  semantics, focus, Escape, shown once, replay, skipped on a deep link); the four\n  pathways; automatic detection of sections opened, source links, a chosen place, the\n  data snapshot, and a Commons room and note; manual ticks; completion with one-time\n  Journey XP; steps hidden when an add-on is absent; suggesting a step to the party;\n  persistence, reset and the Clear-all hook. NOT verified: real browsers (the welcome's\n  layout and motion, reduced-motion handling), live relays, or integration with the full\n  dashboard file.\n  ============================================================================\n-->\n<style id=\"pw-style\">#pwSplash{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#14213d 0%,#0a1220 70%);overflow-y:auto}\n#pwSplash .pw-sky{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#cbd5e1,transparent),radial-gradient(1.5px 1.5px at 40% 75%,#93c5fd,transparent),radial-gradient(1px 1px at 85% 65%,#fff,transparent),radial-gradient(1px 1px at 10% 80%,#e2e8f0,transparent),radial-gradient(1px 1px at 55% 50%,#bfdbfe,transparent);opacity:.8;animation:pwTw 6s ease-in-out infinite alternate}\n.pw-box{position:relative;max-width:640px;width:100%;text-align:center}\n.pw-box h2{font-size:1.6rem;margin-bottom:8px;font-weight:700}\n.pw-box p{color:#94a3b8;font-size:.92rem}\n.pw-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}\n.pw-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;min-height:72px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#e0e7ff;cursor:pointer;font:inherit}\n.pw-card:hover,.pw-card:focus-visible{border-color:#60a5fa;background:rgba(96,165,250,.12);outline:none}\n.pw-card span{color:#94a3b8;font-size:.78rem}\n.pw-anim{animation:pwIn .5s ease both}\n@keyframes pwIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n@keyframes pwTw{from{opacity:.45}to{opacity:.9}}\n@media (prefers-reduced-motion:reduce){.pw-anim,#pwSplash .pw-sky{animation:none!important}}\n@media print{#pwSplash{display:none!important}}\n#pwList ol{margin:10px 0 0;padding:0}\n.pw-step{list-style:none;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}\n.pw-step:last-child{border-bottom:none}\n.pw-done{color:#34d399;margin-top:10px}<\/style>\n<script id=\"pw-module\">/* ============================================================================\n   GUIDED PATHWAYS MODULE: short routes through the dashboard for a purpose, each step with what to do\n   and what you will be able to do afterwards. Doubles as the first-visit welcome (a skippable dialog\n   that offers the routes). Steps tick themselves when the matching thing happens (a section opened, a\n   source link opened, a place chosen, a Commons room joined...), which records that you looked, not that\n   you understood; every step can also be ticked by hand. Progress is local (IndexedDB).\n   Blocks: A data | B state + storage | C progress | D welcome | E host wiring.\n   Extend: add a pathway = one object in PATHS; a step is [title, preferred views, event keys, what to\n   do, outcome, optional need ('commons' or 'journey')]. Event keys: v:<view>, src, near, snap, room, note.\n   Optional companions: window.CivicJourney.reward (XP) and window.CivicCommons.suggest (share a step).\n   ============================================================================ */\n(function(){\n'use strict';\ntry{\nif(typeof switchView!=='function'||typeof VALID_VIEWS==='undefined'||typeof TAB_LABELS==='undefined'||!document.getElementById('mainContent')){\n  console.info('Pathways add-on: host dashboard not detected; skipped.'); return;\n}\nif(document.getElementById('panel-paths')) return;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst DB='civic_dashboard_paths_v1';\nconst getNear=()=>{try{return (typeof nearLocation!=='undefined'&&nearLocation&&Number.isFinite(nearLocation.lat))?nearLocation:null;}catch(e){return null;}};\nconst avail=k=>!k||(k==='commons'?!!window.CivicCommons:VALID_VIEWS.includes('journey'));\nconst stepView=s=>(s[1]||[]).find(v=>VALID_VIEWS.includes(v))||null;\n\n/* ---- A. DATA ---- */\nconst PATHS=[\n {id:'teach',n:'Teach with it',who:'Educators and facilitators',s:[\n  ['Start with the labels',['overview'],['v:overview'],'Open the Overview and expand \"How this dashboard works\". Ask learners what Live, Cached, Calculated, Reference and Unavailable mean.','Outcome: learners can say how a figure was obtained before they trust it.'],\n  ['Read a live feed',['live'],['v:live'],'In the Live Earth Monitor, find the strongest earthquake of the last 24 hours, with its source and age.','Outcome: learners can read a live figure together with its status and time.'],\n  ['Put events on a map',['map','biomes'],['v:map','v:biomes'],'Look at where reports cluster. Ask: what does an empty region tell you, and what does it not?','Outcome: learners connect events to places and see the limits of a feed.'],\n  ['Read a long-run trend',['development'],['v:development'],'Pick one indicator. Is higher or lower better? What might a world average hide?','Outcome: learners separate a trend from a verdict.'],\n  ['Turn reading into action',['action'],['src'],'Open one source link or citizen-science program from Take Action.','Outcome: learners know where to go next.']]},\n {id:'ready',n:'Prepare my household',who:'Anyone planning ahead',s:[\n  ['See your local picture',['near'],['near'],'Under Near You, choose a place. You will see local weather, modelled air quality and nearby events. Nothing about the place is shared.','Outcome: you know what the data says near you.'],\n  ['Find official guidance',['action'],['src'],'In Take Action, open a \"Stay safe\" resource, then find your own local emergency authority.','Outcome: you know where official guidance lives.'],\n  ['Learn how alerts are labelled',['humanitarian'],['v:humanitarian'],'Read how GDACS shows orange and red alert levels.','Outcome: you can read an alert level, and you know it is not a local warning.'],\n  ['Know the limits',['about'],['v:about'],'Read \"What this dashboard deliberately does not do\".','Outcome: you know this page is not an alert system.'],\n  ['Make a plan',['journey'],['v:journey'],'Open the Journey and, with the Preparer skills, tick what is already done on the readiness checklist.','Outcome: a short list of gaps, kept private on your device.','journey']]},\n {id:'brief',n:'Brief a decision-maker',who:'Analysts, officials and journalists',s:[\n  ['Check the baselines',['overview'],['v:overview'],'Read the climate cards and the note on baselines: the temperature figure is land-only, against 1901 to 1930.','Outcome: you can state what a number is measured against.'],\n  ['Note the data years',['development'],['v:development'],'Each World Bank card shows its latest year. Record year, value and direction.','Outcome: you can cite figures with their year.'],\n  ['Respect the categories',['humanitarian'],['v:humanitarian'],'Read the UNHCR figures by category, and the note that they are not summed or ranked here.','Outcome: you avoid adding what should not be added.'],\n  ['Take the data with you',['about'],['snap'],'In About & Your Data, show the JSON snapshot and copy it.','Outcome: a dated record of what you cited.'],\n  ['Cite the sources',['live'],['src'],'Open the source links under Sources & Status.','Outcome: every figure traces back to its provider.']]},\n {id:'join',n:'Join the effort',who:'Citizen scientists and community stewards',s:[\n  ['Pick a program',['action'],['src'],'In Take Action, open a citizen-science program such as iNaturalist, eBird or Zooniverse.','Outcome: you have a concrete way to contribute observations.'],\n  ['See what is at stake',['biodiversity'],['v:biodiversity'],'Read the Red List and population facts.','Outcome: you can explain why conservation status matters.'],\n  ['Gather a party',['commons'],['room'],'Join or create a private room under Commons (P2P).','Outcome: you are collaborating without a central server.','commons'],\n  ['Share what you noticed',['commons'],['note'],'Post a short field note, with no personal details.','Outcome: a shared record your party can build on.','commons'],\n  ['Level up together',['journey'],['v:journey'],'Open the Journey, choose a calling and try a party objective.','Outcome: you are learning and working with others.','journey']]}\n];\n\n/* ---- B. STATE AND STORAGE ---- */\nconst blank=()=>({splash:false,seen:{},man:{},rew:{},fin:{}});\nlet P=blank(), ready=false, dirty=false, lastV='', prevFocus=null;\nlet dbp=null;\nconst idb=()=>dbp||(dbp=new Promise((res,rej)=>{if(!window.indexedDB) return rej(new Error('no indexedDB')); const r=indexedDB.open(DB,1); r.onupgradeneeded=()=>r.result.createObjectStore('kv',{keyPath:'k'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}));\nconst store=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('kv',mode),rq=fn(tx.objectStore('kv')); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);})).catch(()=>null);\nlet st=0; const save=()=>{clearTimeout(st); st=setTimeout(()=>store('readwrite',s=>s.put({k:'me',v:P})),250);};\n\n/* ---- C. PROGRESS ---- */\nconst PANEL=`\n<h2>Guided Pathways<\/h2>\n<p class=\"intro\">Short routes through the dashboard for a purpose, each step with what to do and what you will be able to do afterwards. Steps tick themselves when you open the section or link (that records that you looked, not that you understood, so use the prompts), and you can tick any step yourself. Progress stays in this browser.<\/p>\n<div class=\"form-row\"><button id=\"pwReplay\" class=\"btn btn-secondary\" type=\"button\">Replay the welcome<\/button><span id=\"pwResetArea\"><\/span><\/div>\n<div id=\"pwList\"><\/div>`;\nfunction build(){\n  $('pwList').innerHTML=PATHS.map(p=>'<details class=\"sources-details\" id=\"pwD-'+p.id+'\" style=\"margin-top:12px\"><summary><strong>'+esc(p.n)+'<\/strong> <span class=\"muted\">\u00b7 '+esc(p.who)+' \u00b7 <span id=\"pwP-'+p.id+'\"><\/span><\/span><\/summary><ol>'\n    +p.s.map((s,i)=>'<li class=\"pw-step\" id=\"pwS-'+p.id+'-'+i+'\"><label class=\"check-row\"><input type=\"checkbox\" data-s=\"'+p.id+':'+i+'\"> <strong>'+(i+1)+'. '+esc(s[0])+'<\/strong><\/label><div class=\"fine-print\" style=\"margin:2px 0 2px 26px\">'+esc(s[3])+'<\/div><div class=\"fine-print\" style=\"margin:2px 0 6px 26px\">'+esc(s[4])+'<\/div><div class=\"form-row\" style=\"margin-left:26px\"><button type=\"button\" class=\"btn btn-secondary\" data-go=\"'+p.id+':'+i+'\"><\/button><button type=\"button\" class=\"btn btn-secondary\" data-sug=\"'+p.id+':'+i+'\" hidden>Suggest to my party<\/button><\/div><\/li>').join('')\n    +'<\/ol><p class=\"pw-done\" id=\"pwF-'+p.id+'\" hidden><\/p><\/details>').join('');\n}\nfunction paint(){\n  if(!ready) return;\n  const CC=window.CivicCommons, J=window.CivicJourney, on=!!(CC&&CC.state&&CC.state().on), canReward=!!(J&&J.ready&&J.reward);\n  PATHS.forEach(p=>{\n    let n=0,t=0;\n    p.s.forEach((s,i)=>{\n      const row=$('pwS-'+p.id+'-'+i), a=avail(s[5]); row.hidden=!a; if(!a) return; t++;\n      const key=p.id+':'+i, auto=s[2].some(k=>P.seen[k]), d=auto||!!P.man[key]; if(d) n++;\n      const cb=row.querySelector('input'); cb.checked=d; cb.disabled=auto;\n      const v=stepView(s), go=row.querySelector('[data-go]'); go.hidden=!v; if(v) go.textContent='Open '+(TAB_LABELS[v]||v);\n      row.querySelector('[data-sug]').hidden=!(on&&v&&CC.suggest);\n      if(d&&canReward&&!P.rew[key]){J.reward('path:'+key,8,'pathway step'); P.rew[key]=1; dirty=true;}\n    });\n    $('pwP-'+p.id).textContent=n+' of '+t;\n    const f=$('pwF-'+p.id);\n    if(t&&n===t){f.hidden=false; f.textContent='Pathway complete: '+p.n+'. Every step is done.'; if(canReward&&!P.fin[p.id]){J.reward('path:'+p.id,25,'finished '+p.n); P.fin[p.id]=1; dirty=true;}}\n    else f.hidden=true;\n  });\n  if(dirty){dirty=false; save();}\n}\nconst ev=k=>{if(!P.seen[k]){P.seen[k]=1; save(); paint();}};\n\n/* ---- D. WELCOME: skippable, shown once, never on a deep link; Escape closes; motion respects reduced-motion ---- */\nfunction closeSplash(){const el=$('pwSplash'); if(el) el.remove(); if(prevFocus&&prevFocus.focus) try{prevFocus.focus();}catch(e){}}\nfunction openPath(id){const d=$('pwD-'+id); if(d) d.open=true; switchView('paths');}\nfunction showSplash(){\n  if($('pwSplash')) return;\n  const el=document.createElement('div'); el.id='pwSplash'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-labelledby','pwSplashT');\n  el.innerHTML='<div class=\"pw-sky\" aria-hidden=\"true\"><\/div><div class=\"pw-box pw-anim\"><h2 id=\"pwSplashT\">Civic Benevolence Dashboard<\/h2><p>Real public data, honestly labeled. Choose a guided path, or simply explore.<\/p><div class=\"pw-cards\">'\n    +PATHS.map((p,i)=>'<button type=\"button\" class=\"pw-card pw-anim\" style=\"animation-delay:'+(120+i*90)+'ms\" data-p=\"'+p.id+'\"><strong>'+esc(p.n)+'<\/strong><span>'+esc(p.who)+'<\/span><\/button>').join('')\n    +'<\/div><button type=\"button\" class=\"btn btn-secondary\" data-skip=\"1\">Just explore<\/button><\/div>';\n  prevFocus=document.activeElement; document.body.appendChild(el);\n  const f=el.querySelector('button'); if(f) f.focus();\n}\ndocument.addEventListener('keydown',e=>{\n  const el=$('pwSplash'); if(!el) return;\n  if(e.key==='Escape'){closeSplash(); return;}\n  if(e.key==='Tab'){const b=Array.from(el.querySelectorAll('button')); if(!b.length) return; const i=b.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault(); b[b.length-1].focus();} else if(!e.shiftKey&&i===b.length-1){e.preventDefault(); b[0].focus();}}\n});\ndocument.addEventListener('click',e=>{\n  const t=e.target; if(!t||!t.closest) return;\n  const sp=t.closest('#pwSplash');\n  if(sp){const c=t.closest('[data-p]'); if(c){closeSplash(); openPath(c.dataset.p);} else if(t.closest('[data-skip]')) closeSplash(); return;}\n  if(t.closest('#mainContent a[target=\"_blank\"]')) ev('src');\n  if(t.closest('#snapshotBtn')) ev('snap');\n});\n\n/* ---- E. HOST WIRING ---- */\nVALID_VIEWS.push('paths'); TAB_LABELS.paths='Pathways';\nconst nav=document.createElement('button');\nnav.className='nav-item'; nav.id='tab-paths'; nav.dataset.view='paths';\nnav.setAttribute('role','tab'); nav.setAttribute('aria-selected','false'); nav.setAttribute('aria-controls','panel-paths');\nnav.innerHTML='<span class=\"nav-dot\"><\/span>Pathways';\n($('tab-overview')||document.querySelector('.nav-item')).insertAdjacentElement('afterend',nav);\nnav.addEventListener('click',()=>switchView('paths'));\nconst sec=document.createElement('section');\nsec.className='view'; sec.id='panel-paths'; sec.dataset.view='paths'; sec.tabIndex=0;\nsec.setAttribute('role','tabpanel'); sec.setAttribute('aria-labelledby','tab-paths'); sec.innerHTML=PANEL;\n($('panel-overview')||$('mainContent').firstElementChild).insertAdjacentElement('afterend',sec);\nbuild();\n$('pwList').addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.s; if(!k) return; if(e.target.checked) P.man[k]=1; else delete P.man[k]; save(); paint();});\n$('pwList').addEventListener('click',e=>{\n  const b=e.target.closest('button'); if(!b) return;\n  const key=b.dataset.go||b.dataset.sug; if(!key) return;\n  const [pid,i]=key.split(':'), p=PATHS.find(x=>x.id===pid), s=p&&p.s[+i], v=s&&stepView(s); if(!v) return;\n  if(b.dataset.go) switchView(v); else if(window.CivicCommons&&window.CivicCommons.suggest) window.CivicCommons.suggest(v);\n});\n$('pwReplay').addEventListener('click',showSplash);\nfunction resetArea(){\n  const a=$('pwResetArea'); a.innerHTML='<button id=\"pwReset\" class=\"btn btn-secondary\" type=\"button\">Reset pathway progress\u2026<\/button>';\n  $('pwReset').addEventListener('click',()=>{a.innerHTML='<span class=\"muted\">Erase pathway progress in this browser?<\/span> <button id=\"pwResetYes\" class=\"btn btn-danger\" type=\"button\">Yes, reset<\/button> <button id=\"pwResetNo\" class=\"btn btn-secondary\" type=\"button\">Cancel<\/button>'; $('pwResetNo').addEventListener('click',resetArea); $('pwResetYes').addEventListener('click',async()=>{await reset(false); resetArea();});});\n}\nasync function reset(all){clearTimeout(st); await store('readwrite',s=>s.clear()); const keep=!all&&P.splash; P=blank(); P.splash=keep; if(keep) save(); paint();}\nif(typeof cacheClearAll==='function'){const o=window.cacheClearAll; window.cacheClearAll=async function(){await o.apply(this,arguments); await reset(true);};}\nwindow.CivicPaths={v:1,get ready(){return ready;},open:openPath};\n\nstore('readonly',s=>s.get('me')).then(r=>{\n  if(r&&r.v) P=Object.assign(blank(),r.v);\n  ready=true; resetArea(); paint();\n  const onView=v=>{lastV=v; ev('v:'+v);};\n  const cur=document.querySelector('#mainContent .view.active'); if(cur&&cur.dataset.view) onView(cur.dataset.view);\n  new MutationObserver(()=>{const a=document.querySelector('#mainContent .view.active'), v=a&&a.dataset.view; if(v&&v!==lastV) onView(v);}).observe($('mainContent'),{attributes:true,attributeFilter:['class'],subtree:true});\n  setInterval(()=>{if(getNear()) ev('near'); paint();},2000);\n  let tries=0; const tryCC=()=>{const CC=window.CivicCommons; if(CC){CC.onConnect(()=>{ev('room'); paint();}); CC.onNote(()=>ev('note')); CC.onLeave(()=>paint()); return;} if(++tries<20) setTimeout(tryCC,500);}; tryCC();\n  const hash=location.hash.replace(/^#\\/?/,'');\n  if(!P.splash&&!hash){P.splash=true; save(); showSplash();}\n  if(hash==='paths') switchView('paths',{fromHash:true});\n});\n}catch(err){console.warn('Pathways add-on failed to start; the dashboard is unaffected.',err);}\n})();<\/script>\n"},
{key:"shell",name:"Offline, Depth and Explain",marker:"id=\"sh-module\"",desc:"Opt-in offline mode, a subtle depth layer and an Explain mode with tooltips. Offline mode needs three small files, which the builder also prepares.",text:"<\u0021--\n  ============================================================================\n  OFFLINE, DEPTH AND EXPLAIN ADD-ON: provenance\n  ----------------------------------------------------------------------------\n  Authored by Claude (Anthropic) for the requesting user on 2026-10-15 as a companion to the Civic\n  Benevolence Dashboard. Three small, independent extras. It adds a card to About & Your Data, a toggle\n  to the sidebar footer and a background layer; it adds no view and removes nothing. Any merge order.\n  Remove: delete the block (and sw.js, manifest.webmanifest and icon.svg if you deployed them).\n\n  A. OFFLINE MODE (opt-in, off by default)\n  - Your spec asks for \"full offline fallback\". The data already survives offline (it is cached in\n    IndexedDB and labelled Cached); this adds the page itself. The app is one file, so the service worker\n    (sw.js) only keeps a copy of that file: network first, saved copy when the network fails; data and\n    relay requests are never touched.\n  - The card in About & Your Data registers sw.js and adds a manifest link only when the user presses\n    \"Turn on offline mode\". It needs sw.js next to this page and https or localhost, and says so when\n    unavailable. \"Turn off\" unregisters the worker, deletes the saved copy (cache civic-shell-v1) and removes\n    the manifest link. The dashboard's \"Clear all saved data\" does the same.\n  - The only network activity is the browser fetching sw.js and manifest.webmanifest from this page's own\n    origin, after the user turns offline mode on.\n\n  B. DEPTH\n  - A faint two-layer starfield behind the page drifts slowly as the main area scrolls (CSS transform only,\n    throttled to animation frames, not attached at all under prefers-reduced-motion) plus soft shadows and\n    top lighting on cards. Hidden from assistive technology; not printed.\n\n  C. EXPLAIN MODE (off by default)\n  - A sidebar toggle. While on, hovering or focusing a component shows a plain-language note and how to\n    extend it, wired with aria-describedby; Escape hides it. The notes live in the TIPS list in the module\n    (selector, title, text; specific selectors first). Only the on/off preference is stored.\n\n  DATA AND PRIVACY\n  - IndexedDB database civic_dashboard_shell_v1 holds only the Explain preference. Offline state lives in\n    the browser's own service-worker registration. Nothing is sent anywhere.\n\n  INTEGRATION POINTS\n  - Host DOM: #mainContent, #panel-about (.intro), .sidebar-footer, #refreshLiveBtn. Host global:\n    cacheClearAll (hooked). Tips refer to host names (VALID_VIEWS, TAB_LABELS, TIER_INFO, cardHTML,\n    badgeHTML, LIVE_CAPABLE_LAYERS, buildSearchIndex, layerStatus) and to the other add-ons' components.\n\n  LIMITS\n  - Tooltips appear on hover and keyboard focus; touch users get them when a control is focused. Service\n    workers are strict about scope: sw.js must sit in the same folder as the page.\n\n  VERIFICATION\n  Before delivery: the module parses as JavaScript, and sw.js was run in a Node sandbox\n  with fake caches, fetch and events (install, a failed pre-cache, activation cleanup,\n  an online page load that fills the cache, the offline fallback by exact URL and to the\n  saved index, and non-page requests left alone). The module was exercised in jsdom with\n  the other add-ons on a stub of the dashboard's hooks: opt-in registration (on, off,\n  failure, unsupported, insecure), the manifest link, the Clear-all hook, Explain mode\n  (hover, focus, Escape, description wiring, persistence, add-on components) and the\n  depth layer (scroll-linked, and still under reduced motion). NOT verified: a real\n  service worker in a real browser (updates, scope, cache eviction, installability), how\n  the depth layer and tooltips look and feel, or integration with the full dashboard\n  file.\n  ============================================================================\n-->\n<style id=\"sh-style\">#shDepth{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}\n#shDepth i{position:absolute;inset:-12% 0;background-repeat:repeat}\n#shDepth i.a{background-image:radial-gradient(1px 1px at 30px 40px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 150px 120px,rgba(147,197,253,.5),transparent),radial-gradient(1.2px 1.2px at 220px 20px,rgba(255,255,255,.4),transparent);background-size:260px 200px;transform:translateY(calc(var(--sy,0px) * -0.04))}\n#shDepth i.b{background-image:radial-gradient(1.6px 1.6px at 60px 90px,rgba(255,255,255,.3),transparent),radial-gradient(1.4px 1.4px at 300px 200px,rgba(96,165,250,.35),transparent);background-size:420px 320px;transform:translateY(calc(var(--sy,0px) * -0.09))}\n.card,.facts-card,.action-card,.region-card{box-shadow:0 8px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);background-image:linear-gradient(180deg,rgba(255,255,255,.035),transparent 45%)}\n#shTip{position:fixed;z-index:70;max-width:330px;padding:10px 12px;border-radius:10px;background:#0d1626;border:1px solid rgba(96,165,250,.55);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:.8rem;line-height:1.45;color:#e0e7ff;pointer-events:none}\n#shExplain[aria-pressed=true]{background:rgba(251,191,36,.18);border-color:rgba(251,191,36,.55)}\n.sh-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}\n#shOffBadge{font-size:.72rem;font-weight:600;color:#94a3b8;white-space:nowrap}\n@media print{#shDepth,#shTip,#shExplain,#shOffline{display:none!important}.card,.facts-card,.action-card,.region-card{box-shadow:none!important;background-image:none!important}}<\/style>\n<script id=\"sh-module\">/* ============================================================================\n   SHELL MODULE: three small, independent, opt-in extras. Each block can be deleted on its own.\n   A. Depth: a faint two-layer starfield behind the page that drifts slowly with scrolling (transform only,\n      throttled to animation frames, switched off under prefers-reduced-motion) plus soft card shadows.\n   B. Offline mode: an opt-in card in About & Your Data. It registers sw.js (a service worker that keeps a\n      copy of this page only) and adds a web-app manifest link. Needs sw.js next to this page and https or\n      localhost. Turning it off unregisters the worker and deletes the saved page copy.\n   C. Explain mode: a sidebar toggle; while on, hovering or focusing a component shows a plain-language note\n      and how to extend it. Extend: add one row to TIPS (selector, title, text); order matters, specific first.\n   Expected outcome: nothing here touches the network until Offline mode is turned on by the user.\n   ============================================================================ */\n(function(){\n'use strict';\ntry{\nif(!document.getElementById('mainContent')){console.info('Shell add-on: host dashboard not detected; skipped.'); return;}\nif(document.getElementById('shDepth')) return;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst DB='civic_dashboard_shell_v1';\nlet dbp=null;\nconst idb=()=>dbp||(dbp=new Promise((res,rej)=>{if(!window.indexedDB) return rej(new Error('no indexedDB')); const r=indexedDB.open(DB,1); r.onupgradeneeded=()=>r.result.createObjectStore('kv',{keyPath:'k'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}));\nconst store=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('kv',mode),rq=fn(tx.objectStore('kv')); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);})).catch(()=>null);\nconst savePrefs=()=>store('readwrite',s=>s.put({k:'prefs',v:{explain:explainOn}}));\n\n/* ---- A. DEPTH ---- */\nconst layer=document.createElement('div'); layer.id='shDepth'; layer.setAttribute('aria-hidden','true'); layer.innerHTML='<i class=\"a\"><\/i><i class=\"b\"><\/i>';\ndocument.body.insertBefore(layer,document.body.firstChild);\nconst reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);\nif(!reduce){\n  const m=$('mainContent'); let raf=0;\n  m.addEventListener('scroll',()=>{if(raf) return; raf=requestAnimationFrame(()=>{raf=0; layer.style.setProperty('--sy',m.scrollTop+'px');});},{passive:true});\n}\n\n/* ---- B. OFFLINE MODE (opt-in) ---- */\nconst supported=()=>!!(navigator.serviceWorker&&window.caches);\nconst secure=()=>window.isSecureContext!==false; // true on https and localhost\nconst getReg=async()=>{try{return await navigator.serviceWorker.getRegistration();}catch(e){return null;}};\nconst say=t=>{const m=$('shOffMsg'); if(m) m.textContent=t||'';};\nconst badge=(label,color)=>{const b=$('shOffBadge'); if(b) b.innerHTML='<span class=\"sh-dot\" style=\"background:'+color+'\"><\/span>'+esc(label);};\nfunction manifest(add){\n  const l=document.querySelector('link[rel=\"manifest\"]');\n  if(add&&!l){const k=document.createElement('link'); k.rel='manifest'; k.href='manifest.webmanifest'; document.head.appendChild(k);}\n  if(!add&&l) l.remove();\n}\nasync function refreshOffline(){\n  const on=$('shOffOn'), off=$('shOffOff'); if(!on) return;\n  if(!supported()||!secure()){badge('Unavailable','#94a3b8'); on.disabled=true; off.disabled=true; say(!secure()?'Offline mode needs https or localhost.':'This browser does not support offline mode.'); return;}\n  const r=await getReg(); badge(r?'On':'Off',r?'#10b981':'#94a3b8'); on.disabled=!!r; off.disabled=!r;\n}\nasync function turnOn(){\n  try{await navigator.serviceWorker.register('sw.js',{scope:'./'}); manifest(true); say('Offline mode is on. Let this page finish loading once while online; after that it can open without a connection.');}\n  catch(e){say('Could not turn it on: sw.js was not found next to this page, or the browser refused it.');}\n  refreshOffline();\n}\nasync function turnOff(){\n  try{const r=await getReg(); if(r) await r.unregister(); const ks=await window.caches.keys(); await Promise.all(ks.filter(k=>k.indexOf('civic-shell-')===0).map(k=>window.caches.delete(k)));}catch(e){}\n  manifest(false); say('Offline mode is off and the saved copy of this page was removed.'); refreshOffline();\n}\nconst about=$('panel-about');\nif(about){\n  const card=document.createElement('div'); card.className='facts-card'; card.id='shOffline';\n  card.innerHTML='<div class=\"card-header\"><h3>Offline mode<\/h3><span id=\"shOffBadge\"><\/span><\/div>'\n    +'<p class=\"fact-text\">This page already keeps the latest data it fetched in your browser. Offline mode also keeps a copy of the page itself, so it can open without a connection. It needs <code>sw.js<\/code> next to this page, and https or localhost. Nothing is sent anywhere, and it stays off until you turn it on.<\/p>'\n    +'<div class=\"form-row\"><button id=\"shOffOn\" class=\"btn\" type=\"button\">Turn on offline mode<\/button><button id=\"shOffOff\" class=\"btn btn-secondary\" type=\"button\">Turn off<\/button><\/div><p id=\"shOffMsg\" class=\"fine-print\" role=\"status\" aria-live=\"polite\"><\/p>';\n  const intro=about.querySelector('.intro'); if(intro) intro.insertAdjacentElement('afterend',card); else about.appendChild(card);\n  $('shOffOn').addEventListener('click',turnOn); $('shOffOff').addEventListener('click',turnOff);\n  refreshOffline();\n}\n\n/* ---- C. EXPLAIN MODE ---- */\nconst TIPS=[\n ['#cmStars','Room constellation','You are the centre and each connected peer is a star. Drawn by the Commons add-on from its peer list.'],\n ['#gdTree','Skill constellation','Each star is a skill from the TREE list in the Journey add-on. Select one to read it; unlock it with skill points.'],\n ['#mpSvg','World map','Plots data the dashboard has already loaded. To add a layer, add an entry to LAYERS in the Map add-on.'],\n ['#gdHud','Your progress','Level, XP and unspent skill points. It opens the Journey.'],\n ['.badge','Where this figure came from','Live was fetched just now, Cached is the last good copy saved in your browser, Calculated is computed here, Reference is hand-checked and dated, Unavailable means nothing could be fetched. The tiers live in TIER_INFO, and badgeHTML(tier) draws one.'],\n ['.card','A figure card','Built by cardHTML(title, status, rows). status.tier picks the badge, status.data holds the figures, and a card with no data says so instead of guessing.'],\n ['#refreshLiveBtn','Refresh live data','Fetches every live source once (the page also refreshes itself every 5 minutes). Sources are listed in LIVE_CAPABLE_LAYERS; a new one needs a loader, a layerStatus entry and a card.'],\n ['#searchToggleBtn','Search','Searches the text already on the page, locally. buildSearchIndex() indexes cards, list items and table rows after every render.'],\n ['#dataHealth','Source health','Counts the live sources that answered on the last refresh. At zero, the offline banner appears.'],\n ['.sidebar-nav .nav-item','A view','Each item opens one view. To add a view: push its id onto VALID_VIEWS and TAB_LABELS, add a nav button and a section with the same data-view, and switchView() does the rest.']\n];\nlet explainOn=false, cur=null;\nconst tip=document.createElement('div'); tip.id='shTip'; tip.setAttribute('role','tooltip'); tip.hidden=true; document.body.appendChild(tip);\nconst find=el=>{if(!el||!el.closest) return null; for(const [s,t,d] of TIPS){const m=el.closest(s); if(m) return {m,t,d};} return null;};\nfunction hide(){tip.hidden=true; if(cur){cur.removeAttribute('aria-describedby'); cur=null;}}\nfunction show(e){\n  if(!explainOn) return; const f=find(e.target); if(!f){hide(); return;}\n  if(cur&&cur!==f.m) cur.removeAttribute('aria-describedby');\n  cur=f.m; cur.setAttribute('aria-describedby','shTip');\n  tip.innerHTML='<strong>'+esc(f.t)+'<\/strong><br>'+esc(f.d); tip.hidden=false;\n  const r=f.m.getBoundingClientRect(); tip.style.left=Math.max(8,Math.min(r.left,(window.innerWidth||800)-350))+'px'; tip.style.top=(r.bottom+8)+'px';\n}\ndocument.addEventListener('mouseover',show); document.addEventListener('focusin',show);\ndocument.addEventListener('mouseout',e=>{if(!e.relatedTarget||!find(e.relatedTarget)) hide();});\ndocument.addEventListener('focusout',hide);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape') hide();});\nconst btn=document.createElement('button'); btn.id='shExplain'; btn.type='button'; btn.className='refresh-btn'; btn.setAttribute('aria-pressed','false');\nconst paintExplain=()=>{btn.setAttribute('aria-pressed',explainOn?'true':'false'); btn.textContent='? Explain mode: '+(explainOn?'on':'off'); if(!explainOn) hide();};\nconst sf=document.querySelector('.sidebar-footer'), rb=$('refreshLiveBtn');\nif(sf) sf.insertBefore(btn,rb&&rb.parentNode===sf?rb:null); else document.body.appendChild(btn);\nbtn.addEventListener('click',()=>{explainOn=!explainOn; paintExplain(); savePrefs();});\npaintExplain();\n\n/* ---- Clear-all hook, and restore preferences ---- */\nif(typeof cacheClearAll==='function'){\n  const o=window.cacheClearAll;\n  window.cacheClearAll=async function(){await o.apply(this,arguments); await store('readwrite',s=>s.clear()); explainOn=false; paintExplain(); if(supported()&&secure()) await turnOff();};\n}\nstore('readonly',s=>s.get('prefs')).then(r=>{if(r&&r.v&&r.v.explain){explainOn=true; paintExplain();}});\n}catch(err){console.warn('Shell add-on failed to start; the dashboard is unaffected.',err);}\n})();<\/script>\n"}];
const OFFLINE=[{name:"sw.js",type:"text/javascript",text:"/* ============================================================================\n   Civic Benevolence Dashboard: offline shell (service worker)\n   ----------------------------------------------------------------------------\n   Authored by Claude (Anthropic) for the requesting user on 2026-10-15.\n   Purpose: let the dashboard page open without a connection. The app is one self-contained file, so this\n   worker only has to keep a copy of the page itself. Live data is never cached here: the page already\n   keeps its own copies in IndexedDB and labels them Cached.\n   Strategy: network first for page loads (so you always get the newest page when online), then the saved\n   copy when the network fails. Only GET page navigations are touched; every other request (data APIs,\n   relays, downloads) goes straight to the network, untouched.\n   Install: put this file next to index.html (same folder), serve over https or localhost, then use\n   \"Offline mode\" in About & Your Data. It does nothing until the user turns that on.\n   Remove: use \"Turn off\" in the same card, or delete this file; the cache is named civic-shell-v1 and is\n   deleted on turn-off and on version change. No analytics, no network calls of its own.\n   Verification: exercised in a Node sandbox with fake caches, fetch and events (install, failed install,\n   activation cleanup, online page load with cache fill, offline fallback, non-page requests untouched).\n   Not run in a real browser.\n   ============================================================================ */\nconst CACHE = 'civic-shell-v1';\n\nself.addEventListener('install', e => {\n  // Best effort: if the page is not at ./index.html, the first online page load fills the cache instead.\n  e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html'])).catch(() => {}).then(() => self.skipWaiting()));\n});\n\nself.addEventListener('activate', e => {\n  e.waitUntil(caches.keys()\n    .then(keys => Promise.all(keys.filter(k => k.indexOf('civic-shell-') === 0 && k !== CACHE).map(k => caches.delete(k))))\n    .then(() => self.clients.claim()));\n});\n\nself.addEventListener('fetch', e => {\n  const r = e.request;\n  if (r.method !== 'GET' || r.mode !== 'navigate') return; // only the page itself\n  e.respondWith(\n    fetch(r).then(res => {\n      if (res && res.ok) { const copy = res.clone(); caches.open(CACHE).then(c => c.put(r, copy)).catch(() => {}); }\n      return res;\n    }).catch(() => caches.match(r).then(m => m || caches.match('./index.html')).then(m => m || caches.match('./')))\n  );\n});\n"},

(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// The hooks the add-ons look for; a file missing some still merges, and an add-on that cannot find its hooks skips itself.
const HOOKS=['function switchView','const VALID_VIEWS','const TAB_LABELS','id="tab-near"','id="tab-live"','let layerStatus'];
let HOST=null;
/* Pure merge: returns {html, merged, notes} or {error, notes}. Extend: add an entry to ADDONS (build script) and it appears here. */
function mergeInto(html,picks){
  const notes=[], missing=HOOKS.filter(h=>html.indexOf(h)<0);
  if(missing.length) notes.push('Warning: this file lacks hooks the add-ons look for ('+missing.join(', ')+'). An add-on that cannot find them skips itself safely.');
  const low=html.toLowerCase();
  if(low.split('</body>').length!==2) return {error:'Expected exactly one closing body tag; nothing was changed.',notes};
  const i=low.lastIndexOf('</body>'), add=[];

  if(!add.length) return {error:'Nothing to merge.',notes};
  return {html:html.slice(0,i)+add.map(a=>a.text).join('\n')+'\n'+html.slice(i), merged:add.map(a=>a.name), notes};
}
$('opts').insertAdjacentHTML('beforeend',ADDONS.map(a=>'<label class="opt"><input type="checkbox" data-k="'+esc(a.key)+'" checked><span><strong>'+esc(a.name)+'</strong> <span class="muted">('+Math.round(a.text.length/1024)+' KB)</span><br><span class="muted">'+esc(a.desc)+'</span></span></label>').join(''));
function load(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{HOST={name:file.name,text:String(r.result)}; $('dropText').innerHTML='<strong>'+esc(file.name)+'</strong> <span class="muted">('+Math.round(HOST.text.length/1024)+' KB) loaded. Choose add-ons, then build.</span>'; $('build').disabled=false; $('result').innerHTML='';};
  r.onerror=()=>{$('result').innerHTML='<p class="note">Could not read that file.</p>';};
